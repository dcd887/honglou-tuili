<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅樓推理 · 劉姥姥進大觀園 · 牙牌令 · 第四幕</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：與前三幕逐字相同 —— 9 個 token + 既有平塗舊木 #b9a88c ══
     本幕實機只用到 8 個值：paper / paper2 / card / ink / ink2 / faint / zhu / #b9a88c
     （--line 與 --line2 兩支保留在 :root 裡、全篇不用，故不入實機取值）。
     午宴不用「亮底」：亮靠檐、牆、地面三個面與墨線撐出來，色板一個不加。 */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  /* ══ 窗口自適應（硬規則 ①）════════════════════════════════════════════
     舞台恆為 1200:720。寬度同時受三個上界約束：視窗寬、設計寬 1200、
     以及「視窗高 − 台賬 64 − 上下留白 24」換算過來的寬。三者取最小 —— 於是
     任何窗口比例下整幅畫面等比完整可見：不裁切左右，也不裁切上下，
     並且 html/body 已 overflow:hidden，不會出現滾動條。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--faint);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--faint)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}
  /* ══ 繁／簡切換鍵（角標位）：只用既有 token，不新增顏色 ══ */
  #langbtn{
    flex:0 0 auto;margin:0 6px 0 2px;padding:5px 11px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--faint);border-radius:2px;
  }
  #langbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #langbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}

  /* ══ 線寬三級（與前三幕同值；vector-effect 保證跨視圖不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-paper{fill:var(--paper)}
  .f-p2{fill:var(--paper2)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}
  /* 舞台內的圖元一律以 fill / stroke 取色，不用 currentColor；
     把 SVG 節點的 color 一次釘在墨色上，免得「實機取值」把瀏覽器對 SVG
     的黑色 color 預設算成第 9 個顏色（那不是畫出來的顏色）。 */
  #stage, #stage *{color:var(--ink)}

  /* ══ 視圖切換（本幕 2 個圖形視圖 + 2 種紙頁）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 460ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（硬規則 ②）：非活動層的整棵子樹都不收鼠標 ═════════════════
     pointer-events 可繼承，但子元素一旦顯式寫值就壓過繼承；而 opacity:0
     的元素照樣參與命中測試 —— 兩者相乘，看不見的層會偷走真人的點擊。
     所以：不改任何 .hit 的既有寫法，只把非活動層整棵釘死。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  /* 司命簿／幕間壓在上面時，底下的場景也整棵釘死（syncModal 掛 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展開中的紙頁維持原樣：自己吃鼠標，於是不會漏點到紙後面那些熱點 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 熱點：默認 / 可點 / 已取 三態 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art > path,.hs.on:hover .art > rect,.hs.on:hover .art > circle,
  .hs.on:hover .art > ellipse,.hs.on:hover .art > line,.hs.on:hover .art > polygon,
  .hs.on:hover .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art > path,.hs.armed .art > rect,.hs.armed .art > circle,
  .hs.armed .art > ellipse,.hs.armed .art > line,.hs.armed .art > polygon,
  .hs.armed .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art > text,.hs.armed .art > text{fill:var(--zhu)}
  .hs.on:hover > text,.hs.armed > text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art,.hs.gone > text{opacity:0}

  /* ══ 視角規格：屏幕坐標 = 正面坐標 + 深度·(0,−0.5) ══ */
  .floor{fill:var(--card);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界變化 ① 牌入姿框（框裡的字才顯形）══ */
  .posecell .inp{opacity:0;transition:opacity 340ms ease}
  .posecell.set .inp{opacity:1}
  /* ══ 世界變化 ② 箸入席（席上的字才顯形）══ */
  .placecell .inp{opacity:0;transition:opacity 340ms ease}
  .placecell.set .inp{opacity:1}
  /* ══ 世界變化 ③ 用意既定（簽上的朱框才出來）══ */
  .intentcell .ink{opacity:0;transition:opacity 340ms ease}
  .intentcell.set .ink{opacity:1}
  /* ══ 世界變化 ④ 朱印 ══ */
  .seal{opacity:0;transition:opacity 420ms ease;pointer-events:none}
  .seal.on{opacity:1}
  /* ══ 世界變化 ⑤ 落錯時整框暗一檔（現場變化）══ */
  .posecell,.placecell,.cardcell,.chopcell,.intentcell{transition:opacity 200ms ease}
  .posecell.dimmed,.placecell.dimmed,.cardcell.dimmed,
  .chopcell.dimmed,.intentcell.dimmed{opacity:.3}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：牌順案沿滑回、箸順席沿滑回（現場變化，東西不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:.95}100%{opacity:0}}
  .ghost{opacity:0}
  .ghost.fall{animation:fall 460ms ease-in forwards}

  /* ══ 紙（在場景內展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:18px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：司命簿（沿用前三幕的同一套 .led-*，只改字面）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:18px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }

  /* ══ 三層提示（v1.1）：只用既有 9 個 token，不新增顏色 ══ */
  #hintbtn{
    position:fixed;right:12px;bottom:74px;z-index:60;
    padding:6px 12px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:2px;
  }
  #hintbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}
  #hintpanel{
    position:fixed;right:12px;bottom:112px;z-index:61;
    width:min(440px,calc(100vw - 24px));max-height:52vh;overflow:auto;
    background:var(--card);border:1px solid var(--line2);border-radius:2px;
    box-shadow:0 6px 24px rgba(42,38,34,.14);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    color:var(--ink);padding:12px 14px;display:none;
  }
  #hintpanel.on{display:block}
  #hintpanel h4{margin:0 0 8px;font-size:13px;letter-spacing:.14em;color:var(--zhu);font-weight:600}
  #hintpanel .lvl{margin:0 0 10px;font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
  #hintpanel .lvl b{color:var(--ink);font-weight:600}
  #hintpanel .lvl.answer{color:var(--ink)}
  #hintpanel .acts{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
  #hintpanel button{
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.08em;
    color:var(--ink2);background:var(--paper2);border:1px solid var(--line2);border-radius:2px;
  }
  #hintpanel button:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintpanel .cnt{color:var(--faint);font-size:12px;margin-right:auto;letter-spacing:.06em}
</style>
</head>
<body>

<div id="boot">劉 姥 姥 進 大 觀 園</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       role="application" aria-label="紅樓推理 劉姥姥進大觀園 牙牌令 第四幕">
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：大觀園午宴 · 一幀（全景）══════════════════
           檐 / 牆 / 地面 / 燈 —— 四件齊備，每件東西都待在一個面上，腳下壓一層
           8% 墨接觸影。畫面裡不寫任何位置註釋、不寫任何名姓：人是誰，只在原文裡。
           八個人各擺一姿（噴飯／伏桌／滾進懷裡／摟著／指人／茶噴／飯碗合人／離座），
           姿與姿不同，位置也散開 —— 不是一排人。 -->
      <g id="view-room" class="view active">
        <path class="f-wood" d="M-4,0 L1204,0 L1204,18 L-4,18 Z"/>
        <path class="l3" d="M-4,18 C300,16.6 900,19.2 1204,17.6"/>
        <path class="l3" d="M92,18 L92,34 M292,18 L292,34 M492,18 L492,34 M692,18 L692,34 M892,18 L892,34 M1092,18 L1092,34"/>
        <path class="f-p2" d="M-4,18 L1204,18 L1204,470 L-4,470 Z"/>
        <path class="l3" d="M-4,458 C300,456.6 900,459.2 1204,457.6"/>
        <path class="floor" d="M-4,470 C300,468.6 900,471.2 1204,469.6 L1204,720 L-4,720 Z"/>
        <path class="l2" d="M-4,470 C300,468.6 900,471.2 1204,469.6"/>
        <!-- 匾：園名 -->
        <path class="l1 f-card" d="M148,96 L500,95 L500,150 L148,151 Z"/>
        <text class="tx-k" x="324" y="132" font-size="20" text-anchor="middle" letter-spacing=".34em">大 觀 園</text>
        <!-- 兩盞燈（光源） -->
        <path class="l3" d="M120,18 L120,94 M1150,18 L1150,94"/>
        <path class="l1 f-card" d="M96,94 C106,90 134,90 144,94 L140,148 C130,152 110,152 100,148 Z"/>
        <circle cx="120" cy="118" r="2.8" fill="var(--zhu)"/>
        <path class="l1 f-card" d="M1126,94 C1136,90 1164,90 1174,94 L1170,148 C1160,152 1140,152 1130,148 Z"/>
        <circle cx="1150" cy="118" r="2.8" fill="var(--zhu)"/>

        <!-- 遠一排人（畫在席面之前，下半身被席面遮住）-->
        <g id="figs-far"></g>
        <!-- 小楠木桌旁的劉姥姥（不可點）-->
        <g id="figs-guest"></g>

        <!-- 席面 -->
        <path class="shadow" d="M296,428 L944,426 L952,444 L288,446 Z"/>
        <path class="l1 f-wood" d="M312,332 L928,330 L948,430 L292,432 Z"/>
        <path class="l1 f-card" d="M324,342 L916,340 L932,420 L308,422 Z"/>
        <path class="l2" d="M292,432 L948,430"/>
        <path class="f-wood" d="M300,432 L940,430 L938,470 L302,472 Z"/>
        <path class="l3" d="M310,462 L930,460"/>
        <!-- 席上的器（碗 · 碟 · 壺 · 箸）-->
        <path class="l2 f-card" d="M378,384 C392,374 432,374 446,384 C432,394 392,394 378,384 Z"/>
        <path class="l3" d="M406,378 C410,370 414,370 418,378"/>
        <path class="l2 f-card" d="M488,392 C502,382 542,382 556,392 C542,402 502,402 488,392 Z"/>
        <path class="l2 f-card" d="M616,380 C630,370 670,370 684,380 C670,390 630,390 616,380 Z"/>
        <path class="l3" d="M644,374 C648,366 652,366 656,374"/>
        <path class="l2 f-card" d="M742,392 C756,382 796,382 810,392 C796,402 756,402 742,392 Z"/>
        <path class="l1 f-card" d="M836,372 C850,364 872,364 886,372 L882,398 C868,404 848,404 838,398 Z"/>
        <path class="l3" d="M362,404 L404,400 M446,406 L486,402 M700,404 L742,400"/>
        <path class="l2" d="M540,352 L604,350 M556,356 L620,354"/>

        <!-- 小楠木桌（劉姥姥的一席）-->
        <path class="l1 f-wood" d="M96,404 L252,402 L258,470 L90,472 Z"/>
        <path class="l3" d="M104,462 L246,460"/>
        <path class="l2 f-card" d="M120,398 C132,392 160,392 172,398 C160,406 132,406 120,398 Z"/>

        <!-- 近一排人（畫在席面之後）-->
        <g id="figs-near"></g>
        <!-- 地下的媳婦丫頭（不可點，無 .hs）-->
        <g id="figs-servants"></g>

        <!-- 三個出入口（紙頁與近景）-->
        <g class="hs on" data-hs="h_room_rule" id="hs_room_rule">
          <rect class="hit" x="660" y="24" width="120" height="40"/>
          <g class="art"><path class="l1 miter" d="M666,30 L774,30 L774,58 L666,58 Z" fill="none"/></g>
          <text class="tx-k" x="720" y="53" font-size="13" text-anchor="middle">席上體例</text>
        </g>
        <g class="hs on" data-hs="h_room_src" id="hs_room_src">
          <rect class="hit" x="792" y="24" width="120" height="40"/>
          <g class="art"><path class="l1 miter" d="M798,30 L906,30 L906,58 L798,58 Z" fill="none"/></g>
          <text class="tx-k" x="852" y="53" font-size="13" text-anchor="middle">引文</text>
        </g>
        <g class="hs on" data-hs="h_room_close" id="hs_room_close">
          <rect class="hit" x="924" y="24" width="120" height="40"/>
          <g class="art"><path class="l1 miter" d="M930,30 L1038,30 L1038,58 L930,58 Z" fill="none"/></g>
          <text class="tx-k" x="984" y="53" font-size="13" text-anchor="middle">近前看席</text>
        </g>
      </g>

      <!-- ══════════════════ view-close：席面近景（兩條鏈都在這裡）══════════
           上帶＝鏈① 認笑態（八個姿框 + 八張名牌）；下帶＝鏈② 辨箸（三雙箸 + 三個去處 + 一簽用意）。
           兩條鏈互不相讀：姿框判「這一姿是誰」，箸位判「這一雙去哪」，簽判「這一次的用意」。 -->
      <g id="view-close" class="view">
        <path class="floor" d="M0,0 L1200,0 L1200,720 L0,720 Z"/>
        <path class="l1 f-wood" d="M24,20.4 C74,18.6 128,21.2 176,19.6 L178,70.4 C128,72.2 74,69.6 24,71.4 Z"/>
        <text class="tx-k" x="101" y="54" font-size="18" text-anchor="middle" letter-spacing=".22em">牙 牌 令</text>
        <g class="hs on" data-hs="h_close_rule" id="hs_close_rule">
          <rect class="hit" x="196" y="20" width="118" height="46"/>
          <g class="art"><path class="l1 miter" d="M202,26 L308,26 L308,60 L202,60 Z" fill="none"/></g>
          <text class="tx-k" x="255" y="52" font-size="13" text-anchor="middle">席上體例</text>
        </g>

/* ══ 4. 存讀檔（只加不改）═════════════════════════════════════════════
   寫盤時先把上一次的整個物件讀回來：f 逐鍵併（前三幕的旗一個不動），
   done 只追加、notes 只追加，前三幕的 inv / read / cam / inv2 / read2 / cam2 /
   inv3 / read3 / cam3 七個鍵原樣留著；本幕自己的物件欄／已讀／相機寫在新鍵
   inv4 / read4 / cam4 上。 */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_a4_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    var base = {}, k;
    try{ base = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; }catch(e){ base = {}; }
    var fOut = {};
    if(base.f) for(k in base.f) fOut[k] = base.f[k];
    for(k in F) if(F[k]) fOut[k] = F[k];
    var out = {};
    for(k in base) out[k] = base[k];
    out.f = fOut;
    out.act = Math.max(base.act|0, ACT_NO);
    out.done = DONE;
    out.notes = NOTE_LOG;
    out.inv4 = INV; out.read4 = READ; out.cam4 = CAM;

}

/* ══ 終局摘要（只在 ?title=1 時寫進 document.title）══════════════════════
   走通驗收要的是「兩跑終局摘要相同」。摘要把兩條鏈的答案、旗、落錯次數
   一併寫成一行，兩跑只要有一位不同，SHA256 就不同。 */
var TITLE_DIGEST = /[?&]title=1/.test(location.search);
function digestTitle(){
  if(!TITLE_DIGEST) return;
  document.title = "ACT4"
    + "|POSE:" + [0,1,2,3,4,5,6,7].map(function(i){ return POSE[i]||"-"; }).join(",")
    + "|CHOP:" + PLACES.map(function(p){ return p.k+"="+(CHOP[p.k]||"-"); }).join(",")
    + "|INTENT:" + (INTENT||"-")
    + "|SEAL:" + (F.f_a4_seal_pose?1:0) + (F.f_a4_seal_chop?1:0)
    + "|DONE:" + DONE.join("+")
    + "|MIS:" + MIS
    + "|INV:" + INV.length
    + "|FLAGS:" + allFlagKeys().filter(function(k){ return F[k]; }).length;
}
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    allFlagKeys().forEach(function(k){ if(k in o.f) F[k] = o.f[k]; });
    INV = (o.inv4 && o.inv4.length) ? o.inv4 : startInv();
    READ = o.read4 || []; CAM = o.cam4 || "room";
    if(typeof o.mis4 === "number") MIS = o.mis4;
    PEOPLE.forEach(function(p){ if(F["f_a4_look_"+p.k]) LOOK[p.k] = 1; });
    /* POSE / CHOP / INTENT 由旗還原：插在哪一框是 f_a4_pose_<人>（框序是死的），
       哪一處領了哪一檔是 f_a4_chop_<處>，用意是 f_a4_intent_<值>。
       三支旗互不相干。 */
    PEOPLE.forEach(function(p){
      if(!F["f_a4_pose_"+p.k]) return;
      var i = POSE_TO.indexOf(p.k);
      if(i >= 0) POSE[i] = p.k;
    });
    PLACES.forEach(function(pl){ if(F["f_a4_chop_"+pl.k]) CHOP[pl.k] = CHOP_TO[pl.k]; });
    INTENTS.forEach(function(it){ if(F["f_a4_intent_"+it.k]) INTENT = it.k; });
    return true;
  }catch(e){ return false; }
}

  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="board"?260 : kind==="zhu"?430 : 200;
    o.type = "sine"; o.frequency.value = f;
    g.gain.value = 0.0001; o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="zhu"?0.5:0.22));
    o.start(t); o.stop(t+(kind==="zhu"?0.52:0.24));
  }catch(e){}
}

var PAPER_OPEN = null;

function docDoc(pages, pi, sub, note){
  if(pi < 0) pi = 0;

  var P = pages[pi];
  PAPER_OPEN = P.title;
  clear(paperLayer);
  var W = 740, H = 536, X = 600-W/2, Y = 360-H/2;

  g.appendChild(txt("paper-title", W/2, 46, P.title, { "text-anchor":"middle" }));
  if(sub) g.appendChild(txt("paper-sub", W/2, 70, sub, { "text-anchor":"middle" }));
  var y = 112;
  for(var i=0;i<P.body.length;i++){
    wrap(P.body[i], 32).forEach(function(seg){
      var tx = el("text",{ "class":"paper-body", x:40, y:y });
      var marks = [], cur = 0;
      (P.keys||[]).forEach(function(k){ var idx=0,p; while((p=seg.indexOf(k,idx))>=0){ marks.push([p,p+k.length]); idx=p+1; } });
      marks.sort(function(a,b){ return a[0]-b[0]; });
      marks.forEach(function(m){
        if(m[0] < cur) return;
        if(m[0] > cur){ var n1 = el("tspan"); n1.textContent = seg.slice(cur,m[0]); tx.appendChild(n1); }
        var sp = el("tspan"); sp.setAttribute("class","key"); sp.textContent = seg.slice(m[0],m[1]); tx.appendChild(sp);
        cur = m[1];
      });
      if(cur < seg.length){ var n2 = el("tspan"); n2.textContent = seg.slice(cur); tx.appendChild(n2); }
      g.appendChild(tx); y += 25;
    });
    y += 5;
  }
  if(note) g.appendChild(txt("paper-sub", 40, H-44, note, { "font-size":12.5, fill:"var(--faint)" }));
  g.appendChild(txt("paper-sub langnote", 40, note ? H-26 : H-44, LANG_NOTE, { "font-size":12.5, fill:"var(--faint)" }));
  var total = pages.length;
  if(total > 1){
    for(i=0;i<total;i++){
      g.appendChild(el("circle",{ cx:(W/2 - (total-1)*16/2 + i*16), cy:H-56, r:4,
        fill:(i===pi) ? "var(--zhu)" : "none",
        stroke:(i===pi) ? "none" : "var(--faint)", "stroke-width":1 }));
    }
  }
  if(pi > 0){
    g.appendChild(txt("paper-close", 40, H-30, "◂ 前一頁", { "font-size":14 }));
    var hp = el("rect",{ x:30, y:H-48, width:96, height:30, fill:"transparent" });
    hp.setAttribute("style","cursor:pointer");
    hp.addEventListener("click", function(ev){ ev.stopPropagation(); docDoc(pages, pi-1, sub, note); });
    g.appendChild(hp);
  }
  if(pi < total-1){
    g.appendChild(txt("paper-close", W-40, H-30, "後一頁 ▸", { "font-size":14, "text-anchor":"end" }));
    var hn = el("rect",{ x:W-136, y:H-48, width:96, height:30, fill:"transparent" });
    hn.setAttribute("style","cursor:pointer");
    hn.addEventListener("click", function(ev){ ev.stopPropagation(); docDoc(pages, pi+1, sub, note); });
    g.appendChild(hn);
  }
  g.appendChild(txt("paper-close", W/2, H-12, "點紙外任意處 · 收起", { "text-anchor":"middle" }));
  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
  saveDebounced();
  syncLangNotes();
}

/* ══ 18. 校勘記 ═════════════════════════════════════════════════════════ */
function noteEntries(){

        "另有「离了坐位」的离、「史湘云」的云、「鳳姐儿」的儿、「取個笑儿」的儿。",
        "引文一律照抄原字形：笑岔了气、大火燒了毛毛虫，都沒有規範化、沒有轉繁。",
        "出處：本底本 L9801–L10167（第四十回全回）逐字統計。底本＝PG24264，非權威。" ] });
  out.push({ h:"二 · 八 人 八 姿（L9961-L9966）",
    l:[ "「上上下下都哈哈的大笑起來．史湘云撐不住，一口飯都噴了出來……」——",
        "這是一句，八個人一個接一個寫完：湘云噴飯、黛玉伏桌、寶玉滾進懷裡、",
        "賈母摟著叫心肝、王夫人指著說不出話、薛姨媽茶噴了探春一裙子、",
        "探春的飯碗合在迎春身上、惜春離了坐位叫揉腸子。",
        "按：底本 35 字硬折行，引文是先把 L9961–L9966 連行再斷句，其餘一字不動。",
        "按：迎春只在「合在迎春身上」一句裡出現，畫面上作背景，不入八牌。" ] });
  out.push({ h:"三 · 三 雙 箸（L9941 / L9952-L9954 / L9982）",
    l:[ "「一把烏木三鑲銀箸」按席擺下 —— 這是席上通用的一檔。",
        "「原是鳳姐和鴛鴦商議定了，單拿一雙老年四楞象牙鑲金的筷子与劉姥姥」——",
        "這是單給她的一檔；商議的那一句是「咱們今儿就拿他取個笑儿」。",
        "「忙收了過去，也照樣換上一雙烏木鑲銀的」—— 賈母發話後換回的一檔。",
        "按：L9941 原文在「一把烏木三鑲銀箸」之後有一個缺字（作字面白方框），",
        "後接「炊H位，按席擺下」；本幕只引到「一把烏木三鑲銀箸」與「按席擺下」，",
        "缺字那一段（數量詞與擺法）沒有補、也沒有猜。" ] });
  if(F.f_a4_done){
    out.push({ h:"附 · 這一席所治：三個「原來如此」",
      l:[ "① 姿就是句子，句子就是次序。",
          "② 三雙箸的差別在材與飾；老太太一句「還不換了呢」，換掉的是「金」。",
          "③ 這一次的「優待」不是賞 —— 商議時說的是「拿他取個笑儿」。",
          "本班留下的話：「無徵不信；不假外求。」" ] });

/* ══ 21. 啟動 ═══════════════════════════════════════════════════════════ */
function boot(){
  renderRoomFigs();
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(FRESH){
    try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(NOTES_KEY); }catch(e){}
    resetState(); DONE.length = 0; NOTE_LOG.length = 0;
  }
  else restored = load();
  if(!restored) resetState();
  if(AUTO) resetAct4();
  F.f_a4_seen = true;
  render();
  setCam(CAM || "room");
  syncModal();
  setLang(LANG, true);
  if(AUTO){ showLedger(true); }
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9_]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function allLook(){
    PEOPLE.forEach(function(p){ LOOK[p.k] = 1; F["f_a4_look_"+p.k] = true; });
  }
  function placeAllPose(){
    for(var i=0;i<8;i++){ var k = POSE_TO[i]; POSE[i] = k; F["f_a4_pose_"+k] = true; }
  }
  function chopAll(){
    PLACES.forEach(function(p){ CHOP[p.k] = CHOP_TO[p.k]; F["f_a4_chop_"+p.k] = true; });
    INTENT = INTENT_ANSWER; F["f_a4_intent_"+INTENT_ANSWER] = true;
  }
  if(PROBE){
    if(PROBE === "room"){ showLedger(false); setCam("room"); render(); }
    else if(PROBE === "close"){ showLedger(false); setCam("close"); render(); }
    else if(PROBE === "rule"){ showLedger(false); showRule(0); }
    else if(PROBE === "rule2"){ showLedger(false); showRule(1); }
    else if(PROBE === "src1"){ showLedger(false); showSrc(0); }
    else if(PROBE === "src2"){ showLedger(false); showSrc(1); }
    else if(PROBE === "src3"){ showLedger(false); showSrc(2); }
    else if(PROBE === "notes"){ showLedger(false); showNotes(); }
    else if(PROBE === "ledger"){ showLedger(true); }
    else if(PROBE === "bridge"){ showLedger(false); setCam("room"); render(); openBridge(); }
    else if(PROBE === "person1"){ showLedger(false); setCam("room"); render(); showPerson("xiangyun"); }
    else if(PROBE === "person2"){ showLedger(false); setCam("room"); render(); showPerson("daiyu"); }
    else if(PROBE === "person3"){ showLedger(false); setCam("room"); render(); showPerson("bao"); }
    else if(PROBE === "person4"){ showLedger(false); setCam("room"); render(); showPerson("jiamu"); }
    else if(PROBE === "person5"){ showLedger(false); setCam("room"); render(); showPerson("wang"); }
    else if(PROBE === "person6"){ showLedger(false); setCam("room"); render(); showPerson("xue"); }
    else if(PROBE === "person7"){ showLedger(false); setCam("room"); render(); showPerson("tanchun"); }
    else if(PROBE === "person8"){ showLedger(false); setCam("room"); render(); showPerson("xichun"); }
    else if(PROBE === "pose1"){ showLedger(false); setCam("close"); POSE[0] = "xiangyun"; F.f_a4_pose_xiangyun = true; render(); }
    else if(PROBE === "posehalf"){ showLedger(false); setCam("close");
      ["xiangyun","daiyu","bao","jiamu"].forEach(function(k){ POSE[POSE_TO.indexOf(k)] = k; F["f_a4_pose_"+k] = true; }); render(); }
    else if(PROBE === "posesealed"){ showLedger(false); setCam("close"); placeAllPose(); F.f_a4_seal_pose = true; D("#seal-pose").classList.add("on"); render(); }
    else if(PROBE === "chophalf"){ showLedger(false); setCam("close"); chopAll();
      delete CHOP.liu_place; F.f_a4_chop_liu_place = false; render(); }
    else if(PROBE === "chopsealed"){ showLedger(false); setCam("close"); chopAll(); F.f_a4_seal_chop = true; D("#seal-chop").classList.add("on"); render(); }
    else if(PROBE === "alllook"){ showLedger(false); allLook(); setCam("room"); render(); }
    else if(PROBE === "done"){

      chopAll(); F.f_a4_seal_chop = true; D("#seal-chop").classList.add("on");

/* ══ 22. 自動走通（頁內自測；**不當命中判據** —— 命中另由真鼠標走通驗）═══
   這一支只用 MouseEvent 派發，繞過瀏覽器命中判定，只證明「邏輯鏈能通」。
   它另有一個用途：跨幕測試要 act4 也在同一個桶裡走完一次。 */
var CLICKLOG = [];
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":nohs"); return false; }
  if(n.classList.contains("gone")){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":gone"); return false; }
  if(!inActiveView(n)){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":notactive"); return false; }
  var hit = n.querySelector(".hit") || n;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function runAuto(stop){
  var log = [];
  CLICKLOG.length = 0;
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::ACT4::" + log.join(" | ")
      + " || FLAGS[" + allFlagKeys().filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + MIS
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || POSE[" + [0,1,2,3,4,5,6,7].map(function(i){ return POSE[i]||"-"; }).join(",") + "]"
      + " || CHOP[" + PLACES.filter(function(p){ return CHOP[p.k]; }).map(function(p){ return p.k+":"+CHOP[p.k]; }).join(",") + "]"
      + " || INTENT[" + (INTENT||"-") + "]"
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]"
      + " || NOTES[" + NOTE_LOG.map(function(x){ return "act" + x.act + ":" + x.n; }).join(",") + "]"
      + " || CLICK[" + CLICKLOG.join(" ; ") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在司命簿", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(320);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_入席", click("h_ledger_enter")); await w(340);
    step("3_近前看席", click("h_room_close")); await w(360);
    if(stop === "close"){ step("停在近景", CAM === "close"); report(); return; }
    /* 鏈①：前七姿 —— 取牌 → 插進它那一框 */
    for(var i=0;i<7;i++){
      var k = POSE_TO[i];
      (function(kk, ii){
        step("4" + ii + "_取牌_" + kk, (function(){ click("h_card_"+kk); return SEL === "it_card_"+kk; })());
      })(k, i);
      await w(160);
      (function(kk, ii){
        step("5" + ii + "_入框_" + kk, (function(){ click("h_slot_"+ii); return POSE[ii] === kk; })());
      })(k, i);
      await w(200);
    }
    /* 錯法：惜春的名牌往「摀著寶玉叫心肝」那一框上放（那一框是賈母的）*/
    step("6a_取惜春牌", (function(){ click("h_card_xichun"); return SEL === "it_card_xichun"; })()); await w(180);
    step("6b_取回第三框的牌", (function(){ click("h_slot_3"); return !POSE[3]; })()); await w(260);
    step("6c_再插回第三框", (function(){ click("h_card_jiamu"); click("h_slot_3"); return POSE[3] === "jiamu"; })()); await w(280);
    step("7_惜春歸第八框", (function(){ click("h_card_xichun"); return SEL === "it_card_xichun"; })()); await w(160);
    step("7b_入第八框", (function(){ click("h_slot_7"); return POSE[7] === "xichun"; })()); await w(220);
    step("8_八牌齊", poseCount() === 8);
    step("9_笑態用印", (function(){ click("h_seal_pose"); return !!F.f_a4_seal_pose; })()); await w(460);
    if(stop === "posesealed"){ step("停在笑態用印", !!F.f_a4_seal_pose); report(); return; }
    /* 鏈②：先落錯一雙（象牙鑲金往「按席擺下」那一處）*/
    step("10a_取象牙鑲金", (function(){ click("h_chop_xiangya"); return SEL === "it_chop_xiangya"; })()); await w(180);
    step("10b_錯落按席擺下", (function(){ click("h_place_xi_place"); return MIS >= 1 && !CHOP.xi_place; })()); await w(420);
    step("11a_取烏木三鑲銀", (function(){ click("h_chop_wumu3"); return SEL === "it_chop_wumu3"; })()); await w(160);
    step("11b_落按席擺下", (function(){ click("h_place_xi_place"); return CHOP.xi_place === "wumu3"; })()); await w(200);
    step("12a_取消象牙金", (function(){ click("h_chop_xiangya"); return SEL === "it_chop_xiangya"; })()); await w(160);
    step("12b_落單拿与劉姥姥", (function(){ click("h_place_liu_place"); return CHOP.liu_place === "xiangya"; })()); await w(200);
    step("13a_取烏木鑲銀", (function(){ click("h_chop_wumuyin"); return SEL === "it_chop_wumuyin"; })()); await w(160);
    step("13b_落也照樣換上", (function(){ click("h_place_huan_place"); return CHOP.huan_place === "wumuyin"; })()); await w(200);
    step("14_三雙齊", chopCount() === 3);
    /* 用意：先錯取「抬高」，再取「取笑」*/
    step("15a_錯取抬高", (function(){ click("h_intent_taigao"); return MIS >= 2 && !INTENT; })()); await w(420);
    step("15b_取笑", (function(){ click("h_intent_quxiao"); return INTENT === "quxiao"; })()); await w(240);
    step("16_箸用印", (function(){ click("h_seal_chop"); return !!F.f_a4_seal_chop; })()); await w(900);
    step("17_一幀單已出", PAPER_OPEN !== null);
    step("18_收起一幀單", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(200);
    step("19_收束成立", !!F.f_a4_done);
    step("20_回司命簿", (function(){ clickEl("#bk"); return LEDGER; })()); await w(360);
    step("21_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(440);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(220);
    step("22_再入席", click("h_ledger_enter")); await w(340);
    step("23_本幕已畢", !!F.f_a4_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

  <script>
  (function(){
    var KEY = "honglou.hints.v1", ACT = 4;
    var L = [
      {k:"L1（方向）", v:"席上牙牌令，滿座笑態。先讀第 40 回宴席一段，認出各人笑態，再看那雙筷子的來歷。"},
      {k:"L2（定位）", v:"第 40 回：鴛鴦行令、劉姥姥逗趣，眾人笑態各異；鳳姐遞給劉姥姥一雙象牙鑲金的筷子（比尋常的沉得多），她夾鴿子蛋夾不住、滾落在地——這雙筷子就是「辨箸」的線索。"},
      {k:"L3（本幕答案）", v:"第 40 回：劉姥姥用象牙鑲金筷夾鴿子蛋，蛋滑落滾地，此即「辨箸」；席間牙牌令各人笑態不同——黛玉笑岔了氣、湘雲噴飯，各人反應即「認笑態」。笑態與筷子，都落在劉姥姥這一席上。"}
    ];
    function readAll(){
      try{ var o = JSON.parse(localStorage.getItem(KEY)||"{}"); return (o && typeof o==="object") ? o : {}; }catch(e){ return {}; }
    }
    function writeAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
    var lv = +(readAll()[ACT] || 0);
    var btn = document.getElementById("hintbtn"),
        panel = document.getElementById("hintpanel"),
        body = document.getElementById("hintbody"),
        cnt = document.getElementById("hintcnt"),
        more = document.getElementById("hintmore"),
        closeBtn = document.getElementById("hintclose");
    function paint(){
      var html = "";
      for(var i=0;i<lv;i++){
        html += '<p class="lvl' + (i===2?' answer':'') + '"><b>' + L[i].k + '</b><br>' + L[i].v + '</p>';
      }
      body.innerHTML = html;
      cnt.textContent = lv ? ("已展開 " + lv + "/3") : "卡住了再點一級";
      more.textContent = lv >= 3 ? "答案已顯示" : (lv === 0 ? "看第一級提示" : "再提示一級");
      more.disabled = lv >= 3;
      more.style.opacity = lv >= 3 ? ".45" : "1";
      btn.setAttribute("aria-expanded", panel.classList.contains("on") ? "true" : "false");
    }
    function open(){ panel.classList.add("on"); paint(); }
    function hide(){ panel.classList.remove("on"); btn.setAttribute("aria-expanded","false"); }
    btn.addEventListener("click", function(){
      if(panel.classList.contains("on")){ hide(); return; }
      if(lv === 0){ lv = 1; var o = readAll(); o[ACT] = 1; writeAll(o); }
      open();
    });
    more.addEventListener("click", function(){
      if(lv >= 3) return;
      lv++; var o = readAll(); o[ACT] = lv; writeAll(o); paint();
    });
    closeBtn.addEventListener("click", hide);
    document.addEventListener("keydown", function(e){
      if(e.key === "h" || e.key === "H"){ if(panel.classList.contains("on")){ hide(); } else { if(lv===0){ lv=1; var o=readAll(); o[ACT]=1; writeAll(o); } open(); } }
      if(e.key === "Escape") hide();
    });
    paint();
  })();
  </script>
