:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color:var(--ink)}
html,body{height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);

#app{
  width:min(100%,1200px,calc((100vh - 88px) * 1.66667));

  display:flex; flex-direction:column; min-height:0; gap:5px;
}
header{flex:0 0 auto; display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--line); padding-bottom:5px}
header h1{font-size:20px; font-weight:600; letter-spacing:.1em; flex:0 0 auto}
header .sub{font-size:10.5px; color:var(--faint); letter-spacing:.02em; flex:1 1 auto; min-width:0;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header .rom{flex:0 0 auto; font-size:11px; color:var(--zhu); border:1px solid var(--line); padding:1px 6px}
#flt{flex:0 0 auto; display:flex; align-items:center; gap:5px; flex-wrap:nowrap; overflow:hidden}
#flt .lab{flex:0 0 auto; font-size:11px; color:var(--faint); letter-spacing:.04em}
button.f{flex:0 0 auto; font:inherit; font-size:11px; color:var(--ink2); background:var(--card);
         border:1px solid var(--line); padding:2px 9px; cursor:pointer; letter-spacing:.06em}
button.f:hover{border-color:var(--faint); color:var(--ink)}
button.f.on{color:var(--paper); background:var(--zhu); border-color:var(--zhu)}
#flt .tip{margin-left:auto; flex:0 1 auto; min-width:0; font-size:10px; color:var(--faint);
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#scroll{flex:1 1 auto; min-height:0; overflow:auto; overflow-x:hidden; overscroll-behavior:contain}
#grid{display:grid; grid-template-columns:1fr 1fr; align-items:start; gap:5px; padding:1px 3px 2px 1px}
.card{background:var(--card); border:1px solid var(--line); padding:4px 8px 5px}
.card.hide{display:none}
.card .top{display:flex; align-items:baseline; gap:8px; border-bottom:1px solid var(--line);
           padding-bottom:2px; margin-bottom:2px}
.card .nm{flex:0 0 auto; font-size:14.5px; font-weight:600; letter-spacing:.08em}
.card .note{flex:1 1 auto; min-width:0; font-size:9.5px; color:var(--faint);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .acts{flex:0 0 auto; font-size:10px; color:var(--zhu); letter-spacing:.03em}
.row{padding:1px 0 2px}
.row + .row{border-top:1px dotted var(--line)}
.row .l1{display:flex; align-items:baseline; gap:6px}
.row .ac{flex:0 0 auto; font-size:10px; color:var(--zhu); letter-spacing:.03em}
.row .as{flex:0 0 auto; font-size:9.5px; color:var(--faint); border:1px solid var(--line); padding:0 3px}
.row .id{flex:1 1 auto; min-width:0; font-size:10.5px; color:var(--ink); line-height:1.3}
.row .an{font-size:10.5px; color:var(--ink2); line-height:1.34; margin-top:1px}
.row .an .src{color:var(--faint)}
footer{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
       border-top:1px solid var(--line); padding-top:5px; font-size:10.5px; color:var(--faint)}
footer .hint{flex:1 1 auto; min-width:0; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
footer a{flex:0 0 auto; color:var(--zhu); text-decoration:none; letter-spacing:.06em}
footer a:hover{color:var(--ink)}

var Q = document.createElement.bind(document);
var flt = document.getElementById('flt'), grid = document.getElementById('grid');
var stat = document.getElementById('stat');

function actLab(n){ return D.ui.acts[n-1]; }
function actsOf(p){ var s = [], i; for(i = 0; i < p.rows.length; i++) if (s.indexOf(p.rows[i].a) < 0) s.push(p.rows[i].a); return s; }

/* ---- cards: one per person, per-act sub-rows ---- */
D.people.forEach(function(p){
  var c = Q('article'); c.className = 'card';
  var acts = actsOf(p);
  var top = Q('div'); top.className = 'top';
  var nm = Q('span'); nm.className = 'nm'; nm.textContent = p.nm; top.appendChild(nm);
  if (p.note){ var nt = Q('span'); nt.className = 'note'; nt.textContent = p.note; top.appendChild(nt); }
  var ac = Q('span'); ac.className = 'acts';
  ac.textContent = acts.map(function(n){ return D.ui.nums[n-1]; }).join('·');
  top.appendChild(ac);
  c.appendChild(top);

  p.rows.forEach(function(r){
    var d = Q('div'); d.className = 'row';
    var l1 = Q('div'); l1.className = 'l1';
    var a = Q('span'); a.className = 'ac'; a.textContent = actLab(r.a); l1.appendChild(a);
    if (r.nm !== p.nm){ var sp = Q('span'); sp.className = 'as'; sp.textContent = r.nm; l1.appendChild(sp); }
    var id = Q('span'); id.className = 'id'; id.textContent = r.id; l1.appendChild(id);
    d.appendChild(l1);
    var an = Q('div'); an.className = 'an';
    if (r.an){
      an.appendChild(document.createTextNode('「' + r.an + '」'));
      var src = Q('span'); src.className = 'src';
      src.textContent = '（第' + r.ch + '回 · 程甲本）';
      an.appendChild(src);
    } else {
      an.textContent = D.ui.noAnchor;
    }
    d.appendChild(an);
    d.setAttribute('data-act', r.a);
    c.appendChild(d);
  });
  c.setAttribute('data-acts', acts.join(','));
  grid.appendChild(c);
});

/* ---- filter by act ---- */
var cards = [].slice.call(grid.querySelectorAll('.card'));
function show(n){
  var vis = 0;
  cards.forEach(function(c){
    var ok = !n || (',' + c.getAttribute('data-acts') + ',').indexOf(',' + n + ',') >= 0;
    c.classList.toggle('hide', !ok);
    if (ok) vis++;
  });
  [].slice.call(flt.querySelectorAll('button.f')).forEach(function(b){
    b.classList.toggle('on', String(b.getAttribute('data-n')) === String(n || 0));
  });
  stat.textContent = D.ui.statLab + vis + D.ui.statMid + D.rows + D.ui.statTail + D.hit + '/' + D.rows;
  grid.parentNode.scrollTop = 0;
}
[].slice.call(flt.querySelectorAll('button.f')).forEach(function(b){
  b.addEventListener('click', function(){ show(parseInt(b.getAttribute('data-n'), 10) || 0); });
});

/* number keys 1-5 = act, 0 = all, Esc = back to all */
document.addEventListener('keydown', function(e){
  if (e.key >= '1' && e.key <= '5') show(+e.key);
  else if (e.key === '0' || e.key === 'Escape') show(0);
});

show(0);
