<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅樓推理 · 怡紅院群芳夜宴 · 花籤 · 第一幕</title>
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：與《典藏司》第一幕逐字相同 —— 9 個 token + 既有平塗舊木 #b9a88c，不新增第 8 色 ══ */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* ══ 窗口自適應（硬規則 ①）════════════════════════════════════════════
     舞台恆為 1200:720。寬度同時受三個上界約束：視窗寬 − 16、設計寬 1200、
     以及「視窗高 − 台賬 64 − 上下留白 16」換算過來的寬。三者取最小 —— 於是
     任何窗口比例下整幅畫面等比完整可見：不裁切左右，也不裁切上下，
     並且 html/body 已 overflow:hidden，不會出現滾動條。
     （舊版只顧寬度：min(97vw,1200px)，高度一旦不夠就上下被切；此為修因。）*/
  #app{width:min(100%,1200px,calc((100vh - 80px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--line2);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--line2)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}
  /* ══ 繁／簡切換鍵（角標位）：只用既有 9 個 token，不新增顏色 ══ */
  #langbtn{
    flex:0 0 auto;margin:0 6px 0 2px;padding:5px 11px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:2px;
  }
  #langbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #langbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}

  /* ══ 線寬三級（與《典藏司》同值；vector-effect 保證跨視圖不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}

  /* ══ 視圖切換（本幕 5 個視圖 + 4 個覆蓋層）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 460ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（修正）：非活動層的整棵子樹都不收鼠標 ═══════════════════════
     【原本的病灶】.hs .hit{pointer-events:all} 是「顯式值」，會蓋掉祖先
     .view{pointer-events:none} 的繼承；而 opacity:0 的元素照樣參與命中測試。
     兩者相乘的結果：看不見的 #view-lots / #view-tree / #view-reg / #view-ci
     與收起的 #ledger / #bridge 裡的透明 .hit 矩形仍然接得住鼠標，且因為
     文檔順序在後而蓋在上面 —— 真人點下去，命中的是「別人家的透明矩形」。
     #ledger / #bridge 的熱點沒有 .view 祖先，inActiveView() 判它為真，
     於是還會「按錯鍵」（點「幕間」卻執行「入席」）。
     【修法】不改任何 .hit 的既有寫法（自測仍走同一條路），只把非活動層
     整個子樹用 !important 釘死；動畫照舊，只是動畫期間那一層不吃鼠標。*/
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  /* 司命簿／幕間壓在上面時，底下的場景也整棵釘死（syncModal 掛 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展開中的紙頁維持原樣：自己吃鼠標，於是不會漏點到紙後面那些熱點 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 熱點：默認 / 可點 / 已取 三態 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art path,.hs.on:hover .art rect,.hs.on:hover .art circle,
  .hs.on:hover .art ellipse,.hs.on:hover .art line,.hs.on:hover .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art path,.hs.armed .art rect,.hs.armed .art circle,
  .hs.armed .art ellipse,.hs.armed .art line,.hs.armed .art polygon{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art text,.hs.armed .art text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}
  .hs.breathe .art *{stroke:var(--zhu)!important;animation:breathe 1.2s ease-in-out 2}
  @keyframes breathe{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}

  /* ══ 視角規格（《典藏司》§十二）：屏幕坐標 = 正面坐標 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度預算：桌案進深 32（可見帶高 16）/ 座席腳踏進深 20（帶高 10）/
     簽筒底座進深 24（帶高 12）/ 三廚擱板進深 20（帶高 10）/
     譜系台進深 24（帶高 12）。**全部 ≤ 80** —— 本幕沒有超預算的構件。
     高於視線的水平面：本幕沒有（全部擱板都畫在眼下，比第三幕嚴格）。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界變化 ① 座上手邊的簽位（空 → 已插）══ */
  .signslot .signed{opacity:0;transition:opacity 300ms ease}
  .signslot.set .signed{opacity:1}
  /* ══ 世界變化 ② 簽筒裡的那一支（取走後空）══ */
  #hs_tube .shaft{opacity:1;transition:opacity 300ms ease}
  #hs_tube.drawn .shaft{opacity:0}
  #hs_tube.drawn .empty{opacity:1}
  #hs_tube .empty{opacity:0;transition:opacity 300ms ease}
  /* ══ 世界變化 ③ 簽架上的簽面（翻過才顯）══ */
  #view-lots .stick .face{opacity:0;transition:opacity 260ms ease}
  #view-lots .stick.read .face{opacity:1}
  /* ══ 世界變化 ④ 譜系格裡的名牌 ══ */
  .cellslot .tilein{opacity:0;transition:opacity 340ms ease}
  .cellslot.set .tilein{opacity:1}
  .cellslot.set .qmark{opacity:0}
  .cellslot .qmark{opacity:1;transition:opacity 340ms ease}
  /* ══ 世界變化 ⑤ 關係線 ══ */
  #view-tree .rel{opacity:0;transition:opacity 340ms ease}
  #view-tree .rel.on{opacity:1}
  /* ══ 世界變化 ⑥ 三廚裡的牌 ══ */
  .cup .inp{opacity:0;transition:opacity 340ms ease}
  .cup.set .inp{opacity:1}
  /* ══ 世界變化 ⑦ 判詞頁插進冊頁縫 ══ */
  #view-reg .ver{opacity:0;transition:opacity 340ms ease}
  #view-reg .ver.on{opacity:1}
  /* ══ 世界變化 ⑧ 朱印 ══ */
  .seal{opacity:0;transition:opacity 420ms ease}
  .seal.on{opacity:1}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：簽沿原路滑回的那一下（現場變化，簽不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:.95}100%{opacity:0}}
  .ghost{opacity:0}
  .ghost.fall{animation:fall 460ms ease-in forwards}
  /* ══ 拿在手裡的東西離位微抬 ══ */
  .lift .art{opacity:.72}

  /* ══ 紙（在場景內放大展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:17px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:19px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：司命簿（《典藏司》值房台賬的同一套 .led-*，只改字面）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:18px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }

  /* ══ 三層提示（v1.1）：只用既有 9 個 token，不新增顏色 ══ */
  #hintbtn{
    position:fixed;right:12px;bottom:74px;z-index:60;
    padding:6px 12px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:2px;
  }
  #hintbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}
  #hintpanel{
    position:fixed;right:12px;bottom:112px;z-index:61;
    width:min(440px,calc(100vw - 24px));max-height:52vh;overflow:auto;
    background:var(--card);border:1px solid var(--line2);border-radius:2px;
    box-shadow:0 6px 24px rgba(42,38,34,.14);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    color:var(--ink);padding:12px 14px;display:none;
  }
  #hintpanel.on{display:block}
  #hintpanel h4{margin:0 0 8px;font-size:13px;letter-spacing:.14em;color:var(--zhu);font-weight:600}
  #hintpanel .lvl{margin:0 0 10px;font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
  #hintpanel .lvl b{color:var(--ink);font-weight:600}
  #hintpanel .lvl.answer{color:var(--ink)}
  #hintpanel .acts{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
  #hintpanel button{
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.08em;
    color:var(--ink2);background:var(--paper2);border:1px solid var(--line2);border-radius:2px;
  }
  #hintpanel button:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintpanel .cnt{color:var(--faint);font-size:12px;margin-right:auto;letter-spacing:.06em}
</style>
</head>
<body>

<div id="boot">怡紅院</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       xmlns="http://www.w3.org/2000/svg" role="application" aria-label="紅樓推理 怡紅院群芳夜宴 第一幕">
    <defs>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
    </defs>
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：怡紅院夜宴廳（全景）══════════════════
           同一台虛擬相機、同一斜率 k=0.5。進深預算全部 ≤ 80（見樣式表註釋）。
           八個座席圍着中間的案；每席右側有一個簽位（空槽＝插簽處，已插＝取回處）。 -->
      <g id="view-room" class="view active">
        <!-- ══ 房間框架（硬規則：每件東西都要待在一個面上）════════════════════
             牆 y 76–410 ／ 踢腳線 410–418 ／ 地面 418–720 ／ 兩側立柱 ／ 頂上橫披。
             平塗只有四塊：--paper2（地面）／--card（座席、案心）／舊木 #b9a88c／--zhu。
             每件東西腳下壓一層 8% 墨接觸影（.shadow），不畫紋理。
             畫面裡不寫任何位置註釋（「座上人」「席上的案」一類已刪）。 -->
        <path class="floor" d="M36,418.4 C300,416.6 700,419.2 1164,417.6 L1164,724 L36,724 Z"/>
        <path class="l2" d="M36,418.6 C300,416.8 700,419.4 1164,417.8"/>
        <path class="l3 miter" d="M120,690 C400,688.6 800,691 1080,688.8"/>
        <path class="l1 f-wood" d="M36,410.4 C300,408.6 700,411.2 1164,409.6 L1164,418.4 C700,420.2 300,417.6 36,419.4 Z"/>
        <g class="scenery" pointer-events="none">
          <path class="l1 f-wood" d="M36,44.4 C420,42.6 800,45.2 1164,43.6 L1166,76.4 C800,78.2 420,75.6 36,77.4 Z"/>
          <path class="l3" d="M36,60.4 C420,58.6 800,61.2 1164,59.6"/>
          <path class="l1 f-wood" d="M40,44.4 L68,43.6 L68,410.4 L40,411.4 Z"/>
          <path class="l1 f-wood" d="M1132,43.6 L1160,44.4 L1160,411.4 L1132,410.4 Z"/>
          <path class="l3" d="M54,84 L54,402 M1146,84 L1146,402"/>
        </g>
        <!-- ══ 匾額：吊在橫披下（取代原本浮在空中的那塊木牌）══ -->
        <g class="scenery" pointer-events="none">
          <path class="l3" d="M544,77 L544,112 M656,77 L656,112"/>
          <path class="l1 f-wood" d="M496,112.4 C560,110.6 640,113.2 704,111.6 L706,172.4 C640,174.2 560,171.6 496,173.4 Z"/>
          <path class="l2" d="M508,124 C560,122.6 640,125.2 692,123.6 M508,160 C560,158.6 640,161.2 692,159.6"/>
          <text class="tx-k" x="600" y="152" font-size="26" text-anchor="middle" letter-spacing=".2em">群 芳 夜 宴</text>
        </g>
        <!-- ══ 光源：橫披下兩盞燈（平塗一塊 + 一點朱）══ -->
        <g class="scenery" pointer-events="none">
          <path class="l3" d="M180,77 L180,118 M1020,77 L1020,118"/>
          <path class="l1 f-wood" d="M150,118.4 C170,116.6 190,119.2 210,117.6 L210,148.4 C190,150.2 170,147.6 150,149.4 Z"/>
          <path class="l1 f-wood" d="M990,118.4 C1010,116.6 1030,119.2 1050,117.6 L1050,148.4 C1030,150.2 1010,147.6 990,149.4 Z"/>
          <circle cx="180" cy="159" r="7" fill="var(--zhu)"/>
          <circle cx="1020" cy="159" r="7" fill="var(--zhu)"/>
        </g>
        <!-- ══ 右牆擱板：三張花簽立在板上（不再浮空）══ -->
        <g class="mlot" pointer-events="none">
          <path class="l1 f-wood" d="M796,384.4 C900,382.6 1040,385.2 1116,383.6 L1116,396.4 C1040,398.2 900,395.6 796,397.4 Z"/>
          <path class="shadow" d="M800,396 C900,394.6 1036,397.2 1112,395.6 L1112,401 C1036,402.6 900,400 800,401.4 Z"/>
          <g class="lot">
            <path class="l1 f-card" d="M800,258.4 C832,256.6 866,259.2 894,257.6 L894,384.4 C866,386.2 832,383.6 800,385.4 Z"/>
            <path class="l3 miter" d="M808,374 C834,372.6 866,375.2 886,373.6"/>
            <text class="tx-k" x="847" y="320" font-size="12" text-anchor="middle">牡 丹</text>
          </g>
          <g class="lot">
            <path class="l1 f-card" d="M904,258.4 C936,256.6 970,259.2 998,257.6 L998,384.4 C970,386.2 936,383.6 904,385.4 Z"/>
            <path class="l3 miter" d="M912,374 C938,372.6 970,375.2 990,373.6"/>
            <text class="tx-k" x="951" y="320" font-size="12" text-anchor="middle">杏 花</text>
          </g>
          <g class="lot">
            <path class="l1 f-card" d="M1008,258.4 C1040,256.6 1074,259.2 1102,257.6 L1102,384.4 C1074,386.2 1040,383.6 1008,385.4 Z"/>
            <path class="l3 miter" d="M1016,374 C1042,372.6 1074,375.2 1094,373.6"/>
            <text class="tx-k" x="1055" y="320" font-size="12" text-anchor="middle">桃 花</text>
          </g>
        </g>

/* ══ 2. flags ══════════════════════════════════════════════════════════
   注意：participant 的 flag（f_lot_* / f_tree_* / f_cup_*）**不預先置 false** ——
   否則「缺這一格」與「已置 false」分不開，會把空的當成已佔的。 */
var FLAG_KEYS = [
  "f_seen_act1","f_bridge_read","f_tube_open","f_ci_read","f_rule_read",
  "f_lots_all","f_tree_seal","f_reg_open","f_ver_read","f_reg_seal",
  "f_book_seen","f_act1_done"
];
var F = {}, INV = [], READ = [], SEL = null, CAM = "room", CI_PAGE = 0, LAST_READ = null;
/* 三個鏈的就位表（與 flags 同義，只是給渲染用；都是「由點擊鏈自然成立」的）*/
var PLACED = {};      /* 花籤 key -> 座席 key            */
var TREE   = {};      /* 名牌 key -> 格 id              */
var CUP    = {};      /* 人物牌 key -> 廚 id            */
var REL    = {};      /* 格 id -> 已拉線                */
var STAND  = {};      /* 名牌 key -> 1 在池中 / 0 已擺 */

function allFlagKeys(){
  var a = FLAG_KEYS.slice();
  LOTKEYS.forEach(function(k){ a.push("f_lot_"+k); a.push("f_tree_"+k); a.push("f_cup_"+k); });
  /* 判詞頁自成一個 flag：與人物牌分開，兩個池子才不會互相吞（見 §11）*/
  VERS.forEach(function(v){ a.push("f_vcup_"+v.k); });
  a.push("f_cup_moon");
  return a;
}

function resetState(){
  F = {}; FLAG_KEYS.forEach(function(k){ F[k]=false; });
  F.f_misplaced_count = 0;
  INV = []; READ = []; SEL = null; CAM = "room"; CI_PAGE = 0; LAST_READ = null;
  PLACED = {}; TREE = {}; CUP = {}; REL = {}; STAND = {};
  LOTKEYS.forEach(function(k){ STAND[k] = 1; });
}

/* ══ 3. 存讀檔 ═════════════════════════════════════════════════════════ */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act1_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      f:F, inv:INV, read:READ, cam:CAM, ts:Date.now(),
      act:ACT_NO, done:DONE, notes:NOTE_LOG
    }));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    FLAG_KEYS.forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    allFlagKeys().forEach(function(k){ if(k in o.f) F[k]=o.f[k]; });
    if(typeof o.f.f_misplaced_count === "number") F.f_misplaced_count = o.f.f_misplaced_count;
    INV = o.inv || []; READ = o.read || []; CAM = o.cam || "room";
    /* 由 flags 重算三張就位表 —— f 是唯一真相 */
    LOTKEYS.forEach(function(k){ if(F["f_lot_"+k]) PLACED[k] = k; });
    PLATES.forEach(function(pl){ if(F["f_tree_"+pl.k]) TREE[pl.k] = pl.cell; });
    CARDS.forEach(function(c){ if(F["f_cup_"+c.k]) CUP[c.k] = c.cup; });
    LOTKEYS.forEach(function(k){ STAND[k] = (INV.indexOf("it_lot_"+k) >= 0) ? 0 : (F["f_lot_"+k] ? 0 : 1); });
    return true;
  }catch(e){ return false; }
}

var AC = null, SND = true;
function sfx(kind){
  if(!SND) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    var f = kind==="wood"?150 : kind==="board"?260 : kind==="zhu"?430 : 200;
    o.type = "sine"; o.frequency.value = f;
    g.gain.value = 0.0001; o.connect(g); g.connect(AC.destination);
    g.gain.exponentialRampToValueAtTime(0.06, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(kind==="zhu"?0.5:0.22));
    o.start(t); o.stop(t+(kind==="zhu"?0.52:0.24));
  }catch(e){}
}

  var n = document.getElementById("hs_led_notes");

/* ══ 12. 紙：在場景內展開（籤面 / 辭典頁 / 命運簿 / 校勘記）═════════ */
var PAPER_OPEN = null;
function wrap(s, n){ var out = [], i; for(i=0;i<s.length;i+=n) out.push(s.slice(i,i+n)); return out; }
function paper(title, sub, body, keys, note){
  PAPER_OPEN = title;
  clear(paperLayer);
  var W = 700, H = 470, X = 600-W/2, Y = 360-H/2;
  var g = el("g", { "class":"paper show", transform:"translate("+X+","+Y+")" });
  g.appendChild(el("rect",{ x:-4, y:-4, width:W+8, height:H+8, rx:4, "class":"shadow" }));
  g.appendChild(el("path",{ "class":"l1 f-card",
    d:"M2,2.6 C180,1 520,3.2 698,1.6 L698,"+(H-1.6)+" C520,"+(H-3.4)+" 180,"+(H-0.8)+" 2,"+(H-2.4)+" Z" }));
  g.appendChild(txt("paper-title", W/2, 50, title, { "text-anchor":"middle" }));
  if(sub) g.appendChild(txt("paper-sub", W/2, 76, sub, { "text-anchor":"middle" }));
  var y = 124;
  for(var i=0;i<body.length;i++){
    wrap(body[i], 28).forEach(function(seg){
      var tx = el("text",{ "class":"paper-body", x:44, y:y });
      var marks = [], cur = 0;
      (keys||[]).forEach(function(k){ var idx=0,p; while((p=seg.indexOf(k,idx))>=0){ marks.push([p,p+k.length]); idx=p+1; } });
      marks.sort(function(a,b){ return a[0]-b[0]; });
      marks.forEach(function(m){
        if(m[0] < cur) return;
        if(m[0] > cur){ var n1 = el("tspan"); n1.textContent = seg.slice(cur,m[0]); tx.appendChild(n1); }
        var sp = el("tspan"); sp.setAttribute("class","key"); sp.textContent = seg.slice(m[0],m[1]); tx.appendChild(sp);
        cur = m[1];
      });
      if(cur < seg.length){ var n2 = el("tspan"); n2.textContent = seg.slice(cur); tx.appendChild(n2); }
      g.appendChild(tx); y += 26;
    });
    y += 4;
  }
  if(note) g.appendChild(txt("paper-sub", 44, H-40, note, { "font-size":13, fill:"var(--faint)" }));
  /* 簡體狀態下要聲明這是轉寫 —— 一律畫出，由 syncLangNotes 決定顯不顯形 */
  g.appendChild(txt("paper-sub langnote", 44, note ? H-58 : H-40, LANG_NOTE, { "font-size":13, fill:"var(--faint)" }));
  g.appendChild(txt("paper-close", W/2, H-16, "點紙外任意處 · 收起", { "text-anchor":"middle" }));
  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
  render(); saveDebounced();
  syncLangNotes();
}

/* ══ 14. 渲染（唯一的真相來源：flags 與三張就位表）══════════════════ */
function render(){
  /* ① 座席上那支籤 */
  var seats = document.querySelectorAll(".seat");
  for(var i=0;i<seats.length;i++){
    var k = seats[i].getAttribute("data-key");
    var sl = document.getElementById("seat-" + k);
    if(sl) sl.classList.toggle("set", !!F["f_lot_"+k]);
  }
  /* ② 籤筒 */
  var tb = D("#hs_tube");
  if(tb) tb.classList.toggle("drawn", LOTKEYS.every(function(k){ return !!F["f_lot_"+k]; }) || INV.length > 0);
  /* ③ 籤架上的簽面 */
  var sticks = document.querySelectorAll("#view-lots .stick");
  for(i=0;i<sticks.length;i++){
    var kk = sticks[i].getAttribute("data-key");
    sticks[i].classList.toggle("read", READ.indexOf("lot_"+kk) >= 0);
  }
  /* ④ 籤架的已插（近景裡那一支籤不再供取）*/
  for(i=0;i<LOTKEYS.length;i++){
    var hk = D('#hs_lot_' + LOTKEYS[i]);
    if(hk) hk.classList.toggle("gone", !!F["f_lot_"+LOTKEYS[i]]);
  }
  /* ⑤ 譜系格 */
  for(i=0;i<CELLS.length;i++){
    var c = CELLS[i], host = document.getElementById("in-" + c.id);
    if(host) drawCell(c.id, host);
  }
  renderPool();
  renderRels();
  var ts = D("#tree-sealmark"); if(ts) ts.classList.toggle("on", !!F.f_tree_seal);
  var hts = document.getElementById("hs_tree_seal");
  if(hts) hts.classList.toggle("on", !!F.f_tree_seal ? false : true);
  /* ⑥ 三廚 */
  for(i=0;i<CUPS.length;i++){
    var cu = CUPS[i], h2 = document.getElementById("in-cup-" + cu.id);
    if(h2) drawCup(cu.id, h2);
  }
  for(i=0;i<VERS.length;i++){
    var v = VERS[i], h3 = document.getElementById("ver-cup-" + v.cup);
    if(h3 && F["f_cup_"+v.k]){ /* 由渲染器在自己的廚裡畫出來 */ }
  }
  drawVers();
  renderCardPool();
  var rsm = D("#reg-sealmark"); if(rsm) rsm.classList.toggle("on", !!F.f_reg_seal);
  var hrs = document.getElementById("hs_reg_seal");
  if(hrs) hrs.classList.toggle("on", !!F.f_reg_seal ? false : true);
  /* ⑦ 收束 */
  if(F.f_lots_all && F.f_tree_seal && F.f_reg_seal) F.f_act1_done = true;
  renderLedger(); renderInv(); applyArmed();
}

    else if(PROBE === "tree"){ showLedger(false); setCam("tree"); render(); }
    else if(PROBE === "reg"){ showLedger(false); setCam("reg"); render(); }

    else if(PROBE === "half"){

    }
    else if(PROBE === "treedone"){

      F.f_lots_all = true;
      PLATES.forEach(function(pl){ TREE[pl.k] = pl.cell; F["f_tree_"+pl.k] = true; });
      CELLS.forEach(function(c){ REL[c.id] = 1; });
      F.f_tree_seal = true;
      CARDS.forEach(function(c){ CUP[c.k] = c.cup; F["f_cup_"+c.k] = true; });
      VERS.forEach(function(v){ F["f_vcup_"+v.k] = true; });
      F.f_reg_seal = true; F.f_act1_done = true;
      showLedger(false); setCam("reg"); render();
    }
    else if(PROBE === "done"){
      LOTKEYS.forEach(function(k){ F["f_lot_"+k] = true; PLACED[k] = k; });
      F.f_lots_all = true;
      PLATES.forEach(function(pl){ TREE[pl.k] = pl.cell; F["f_tree_"+pl.k] = true; });
      CELLS.forEach(function(c){ REL[c.id] = 1; });
      F.f_tree_seal = true;
      CARDS.forEach(function(c){ CUP[c.k] = c.cup; F["f_cup_"+c.k] = true; });

/* ══ 23. 自動走通：清檔重來 + 只用真實 MouseEvent('click') 打真實 .hit ══
   腳本**不直接改任何 flag**：籤靠「取籤 → 放席」自然成立，譜系靠「取名牌 →
   擺格 → 拉線 → 用印」自然成立，分冊靠「取牌 → 入廚 → 插判詞頁 → 用印」自然成立。
   runAuto 裡沒有任一處 F.xxx = true。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":nohs"); return false; }
  if(n.classList.contains("gone")){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":gone"); return false; }
  if(!inActiveView(n)){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":notactive(v="+(n.closest(".view")?n.closest(".view").id+"|"+n.closest(".view").getAttribute("class"):"noview")+"/CAM="+CAM+")"); return false; }
  var hit = n.querySelector(".hit") || n;
  if(CLICKLOG.length < 70) CLICKLOG.push(hsId + "{SEL=" + SEL + "}");
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function slotOf(itemId){
  var i = INV.indexOf(itemId); if(i < 0) return null;
  return document.querySelector('.slot[data-slot="'+i+'"]');
}
function pickSlot(itemId){
  if(SEL === itemId) return true;
  var s = slotOf(itemId); if(!s) return false;
  s.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return SEL === itemId;
}
/* 自測用：把手上那張名牌放下（走同一條 pullPlate —— 不直接改 flag）*/
function pullPlateBack(){

  pullPlate(SEL.slice(9));
  return true;
}
async function runAuto(stop){
  var log = [];

  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); if(TAKELOG.length < 20) TAKELOG.push("@" + name + ":Fbao=" + (F.f_lot_bao?"T":"F") + "Fxi=" + (F.f_lot_xi?"T":"F") + "Sel=" + SEL); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + allFlagKeys().filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + F.f_misplaced_count
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || READ[" + READ.join(",") + "]"

    document.body.setAttribute("data-selftest", log.join(" | "));

  try{
    if(stop === "ledger"){ step("停在司命簿", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(320);

      await w(140);

    step("27_格線齊", cellUsed().every(function(cc){ return !!REL[cc]; }));
    step("28_用印", (function(){ click("h_tree_seal"); return !!F.f_tree_seal; })()); await w(420);
    /* ── 鏈③ 分冊 ─────────────────────────────────────────── */
    step("29_去分冊", (function(){ click("h_tree_go"); return window.CAM() === "reg"; })()); await w(400);
    step("30_讀薄命司一頁", (function(){ click("h_reg_ci"); return PAPER_OPEN !== null; })()); await w(340);
    step("31_收起薄命司", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(180);
    step("31b_回三廚", (function(){ goReg(); return window.CAM() === "reg"; })()); await w(300);
    /* 錯法四：把「寶釵」的人物牌放進「無冊」格 */
    step("32_取寶釵牌", (function(){ click("h_card_bao"); return SEL === "it_card_bao"; })()); await w(240);
    step("33_放進無冊格", (function(){ click("h_cup_cups_wu"); return (F.f_misplaced_count|0) >= 4; })()); await w(420);
    step("34_錯法四已記_該廚未收", !F.f_cup_bao);
    var cpairs = [["bao","cups_zheng"],["dai","cups_zheng"],["tan","cups_zheng"],
                  ["xiang","cups_zheng"],["li","cups_zheng"],
                  ["chun","cups_fu"],["xi","cups_you"],["moon","cups_wu"]];
    for(i=0;i<cpairs.length;i++){
      (function(kk, cc){
        step("35_" + kk + "_取牌", (function(){ click("h_card_"+kk); return SEL === "it_card_"+kk; })());
      })(cpairs[i][0], cpairs[i][1]);
      await w(160);
      (function(kk, cc){
        step("36_" + kk + "_入廚", (function(){ click("h_cup_"+cc); return !!F["f_cup_"+kk]; })());
      })(cpairs[i][0], cpairs[i][1]);
      await w(260);
    }
    step("37_八牌入廚", CARDS.every(function(c){ return !!F["f_cup_"+c.k]; }));
    var vk = ["bao","dai","tan","xiang","li","chun","xi"];
    for(i=0;i<vk.length;i++){
      (function(kk){
        step("38_" + kk + "_取判詞", (function(){ click("h_ver_"+kk); return SEL === "it_ver_"+kk; })());
      })(vk[i]);
      await w(160);
      (function(kk){
        var cup = VER_BY[kk].cup;
        step("39_" + kk + "_插廚縫", (function(){ click("h_cup_"+cup); return !!F["f_vcup_"+kk]; })());
      })(vk[i]);
      await w(260);
    }
    step("40_七首判詞已插", vk.every(function(kk){ return !!F["f_vcup_"+kk]; }));
    step("41_用印", (function(){ click("h_reg_seal"); return !!F.f_reg_seal; })()); await w(1000);
    step("42_命運簿已出", PAPER_OPEN !== null);
    step("43_收起命運簿", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(200);
    step("44_收束成立", !!F.f_act1_done);
    /* ── 收束：回司命簿 → 校勘記 ─────────────────────────── */
    step("45_開司命簿", (function(){ clickEl("#bk"); return LEDGER; })()); await w(360);
    step("46_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(440);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(220);
    step("47_再入席", click("h_ledger_enter")); await w(360);
    step("48_收束_本幕已畢", !!F.f_act1_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);

  <button id="hintbtn" type="button" aria-controls="hintpanel" aria-expanded="false">提示</button>
  <div id="hintpanel" role="dialog" aria-label="提示">
    <h4>提示 · 第1幕 · 怡紅院群芳夜宴</h4>
    <div id="hintbody"></div>
    <div class="acts">
      <span class="cnt" id="hintcnt"></span>
      <button type="button" id="hintmore">看第一級提示</button>
      <button type="button" id="hintclose">收起</button>
    </div>
  </div>
  <script>
  (function(){
    var KEY = "honglou.hints.v1", ACT = 1;
    var L = [
      {k:"L1（方向）", v:"夜宴眾芳，各抽一籤。先讀第 63 回開夜宴一段，把每支籤上的花名、籤語與抽籤人逐一對上，別漏了籤上的詩句。"},
      {k:"L2（定位）", v:"花籤段落集中在第 63 回中段。每支籤刻花名與兩句籤語，籤語多為舊詩；花名與籤語合起來，正指向抽籤之人的身份。"},
      {k:"L3（本幕答案）", v:"第 63 回：寶釵抽牡丹「任是無情也動人」；黛玉抽芙蓉「莫怨東風當自嗟」；探春抽杏花「日邊紅杏倚雲栽」；湘雲抽海棠「只恐夜深花睡去」；麝月抽荼蘼「開到荼蘼花事了」；襲人抽桃花「桃紅又是一年春」。花名喻人，籤語即答案。"}
    ];
    function readAll(){
      try{ var o = JSON.parse(localStorage.getItem(KEY)||"{}"); return (o && typeof o==="object") ? o : {}; }catch(e){ return {}; }
    }
    function writeAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
    var lv = +(readAll()[ACT] || 0);
    var btn = document.getElementById("hintbtn"),
        panel = document.getElementById("hintpanel"),
        body = document.getElementById("hintbody"),
        cnt = document.getElementById("hintcnt"),
        more = document.getElementById("hintmore"),
        closeBtn = document.getElementById("hintclose");
    function paint(){
      var html = "";
      for(var i=0;i<lv;i++){
        html += '<p class="lvl' + (i===2?' answer':'') + '"><b>' + L[i].k + '</b><br>' + L[i].v + '</p>';
      }
      body.innerHTML = html;
      cnt.textContent = lv ? ("已展開 " + lv + "/3") : "卡住了再點一級";
      more.textContent = lv >= 3 ? "答案已顯示" : (lv === 0 ? "看第一級提示" : "再提示一級");
      more.disabled = lv >= 3;
      more.style.opacity = lv >= 3 ? ".45" : "1";
      btn.setAttribute("aria-expanded", panel.classList.contains("on") ? "true" : "false");
    }
    function open(){ panel.classList.add("on"); paint(); }
    function hide(){ panel.classList.remove("on"); btn.setAttribute("aria-expanded","false"); }
    btn.addEventListener("click", function(){
      if(panel.classList.contains("on")){ hide(); return; }
      if(lv === 0){ lv = 1; var o = readAll(); o[ACT] = 1; writeAll(o); }
      open();
    });
    more.addEventListener("click", function(){
      if(lv >= 3) return;
      lv++; var o = readAll(); o[ACT] = lv; writeAll(o); paint();
    });
    closeBtn.addEventListener("click", hide);
    document.addEventListener("keydown", function(e){
      if(e.key === "h" || e.key === "H"){ if(panel.classList.contains("on")){ hide(); } else { if(lv===0){ lv=1; var o=readAll(); o[ACT]=1; writeAll(o); } open(); } }
      if(e.key === "Escape") hide();
    });
    paint();
  })();
  </script>
