<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅樓推理 · 元妃省親 · 大觀園 · 第二幕</title>
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：與第一幕逐字相同 —— 9 個 token + 既有平塗舊木 #b9a88c ══
     本幕實機只用到 8 個值：paper / paper2 / card / ink / ink2 / faint / zhu / #b9a88c
     （--line 與 --line2 兩支保留在 :root 裡、全篇不用，故不入實機取值）。 */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  /* ══ 窗口自適應（硬規則 ①）════════════════════════════════════════════
     舞台恆為 1200:720。寬度同時受三個上界約束：視窗寬、設計寬 1200、
     以及「視窗高 − 台賬 64 − 上下留白 24」換算過來的寬。三者取最小 —— 於是
     任何窗口比例下整幅畫面等比完整可見：不裁切左右，也不裁切上下，
     並且 html/body 已 overflow:hidden，不會出現滾動條。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--faint);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--faint)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}
  /* ══ 繁／簡切換鍵（角標位）：只用既有 token，不新增顏色 ══ */
  #langbtn{
    flex:0 0 auto;margin:0 6px 0 2px;padding:5px 11px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--faint);border-radius:2px;
  }
  #langbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #langbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}

  /* ══ 線寬三級（與第一幕同值；vector-effect 保證跨視圖不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-paper{fill:var(--paper)}
  .f-p2{fill:var(--paper2)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}
  /* 舞台內的圖元一律以 fill / stroke 取色，不用 currentColor；
     把 SVG 節點的 color 一次釘在墨色上，免得「實機取值」把瀏覽器對 SVG
     的黑色 color 預設算成第 9 個顏色（那不是畫出來的顏色）。 */
  #stage, #stage *{color:var(--ink)}

  /* ══ 視圖切換（本幕 2 個圖形視圖 + 2 種紙頁）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 460ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（硬規則 ②）：非活動層的整棵子樹都不收鼠標 ═════════════════
     pointer-events 可繼承，但子元素一旦顯式寫值就壓過繼承；而 opacity:0
     的元素照樣參與命中測試 —— 兩者相乘，看不見的層會偷走真人的點擊。
     所以：不改任何 .hit 的既有寫法，只把非活動層整棵釘死。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *,
  #kin-body:not(.on), #kin-body:not(.on) *{pointer-events:none!important}
  /* 司命簿／幕間壓在上面時，底下的場景也整棵釘死（syncModal 掛 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展開中的紙頁維持原樣：自己吃鼠標，於是不會漏點到紙後面那些熱點 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 熱點：默認 / 可點 / 已取 三態 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art > path,.hs.on:hover .art > rect,.hs.on:hover .art > circle,
  .hs.on:hover .art > ellipse,.hs.on:hover .art > line,.hs.on:hover .art > polygon,
  .hs.on:hover .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art > path,.hs.armed .art > rect,.hs.armed .art > circle,
  .hs.armed .art > ellipse,.hs.armed .art > line,.hs.armed .art > polygon,
  .hs.armed .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art > text,.hs.armed .art > text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art{opacity:0}

  /* ══ 視角規格：屏幕坐標 = 正面坐標 + 深度·(0,−0.5)，k = 0.5 ══
     本幕深度預算：御座座基進深 24（帶高 12）/ 月台進深 16（帶高 8）/
     書案進深 20（帶高 10）/ 木牌底座進深 12（帶高 6）。全部 ≤ 80。 */
  .floor{fill:var(--paper2);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界變化 ① 名簽翻面（翻過來才見稱謂）══ */
  .tagplate .tagtx{opacity:0;transition:opacity 300ms ease}
  .tagplate.up .tagtx{opacity:1}
  .tagplate .tagblank{opacity:1;transition:opacity 300ms ease}
  .tagplate.up .tagblank{opacity:0}

  /* ══ 世界變化 ② 席槽收牌 ══ */
  .slotcell .inp{opacity:0;transition:opacity 340ms ease}
  .slotcell.set .inp{opacity:1}

  /* ══ 世界變化 ③ 朱印 ══ */
  .seal{opacity:0;transition:opacity 420ms ease;pointer-events:none}
  .seal.on{opacity:1}

  /* ══ 世界變化 ④ 落錯時整檔暗一檔（現場變化）══ */
  .tierrow{transition:opacity 200ms ease}
  .tierrow.dimmed{opacity:.3}
  /* 親疏盤在認席用印之前不顯形 —— 不是只關命中：沒開的盤不能看着像開了 */
  #kin-body{opacity:1;transition:opacity 320ms ease}
  #kin-body.locked{opacity:.44}

  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：牌順席沿滑回的那一下（現場變化，牌不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:.95}100%{opacity:0}}
  .ghost{opacity:0}
  .ghost.fall{animation:fall 460ms ease-in forwards}

  /* ══ 紙（在場景內展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:18px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：司命簿（沿用第一幕的同一套 .led-*，只改字面）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:18px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }

  /* ══ 三層提示（v1.1）：只用既有 9 個 token，不新增顏色 ══ */
  #hintbtn{
    position:fixed;right:12px;bottom:74px;z-index:60;
    padding:6px 12px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:2px;
  }
  #hintbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}
  #hintpanel{
    position:fixed;right:12px;bottom:112px;z-index:61;
    width:min(440px,calc(100vw - 24px));max-height:52vh;overflow:auto;
    background:var(--card);border:1px solid var(--line2);border-radius:2px;
    box-shadow:0 6px 24px rgba(42,38,34,.14);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    color:var(--ink);padding:12px 14px;display:none;
  }
  #hintpanel.on{display:block}
  #hintpanel h4{margin:0 0 8px;font-size:13px;letter-spacing:.14em;color:var(--zhu);font-weight:600}
  #hintpanel .lvl{margin:0 0 10px;font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
  #hintpanel .lvl b{color:var(--ink);font-weight:600}
  #hintpanel .lvl.answer{color:var(--ink)}
  #hintpanel .acts{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
  #hintpanel button{
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.08em;
    color:var(--ink2);background:var(--paper2);border:1px solid var(--line2);border-radius:2px;
  }
  #hintpanel button:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintpanel .cnt{color:var(--faint);font-size:12px;margin-right:auto;letter-spacing:.06em}

  /* ══ v1.1 物件可读性（A+B）：背包格悬停名 + 常驻「手上」 ══ */
  .hand{
    margin-left:auto; margin-right:8px; align-self:center;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif; font-size:13px; letter-spacing:.08em;
    color:var(--zhu); white-space:nowrap; max-width:46vw; overflow:hidden; text-overflow:ellipsis;
  }
  #slots .slot[title]{cursor:pointer}
</style>
</head>
<body>

<div id="boot">省 親 別 墅</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       role="application" aria-label="紅樓推理 元妃省親 大觀園 第二幕">
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：省親夜 · 正殿（全景）══════════════════
           牆 / 踢腳線 / 地面 / 兩側立柱 / 頂上橫披 —— 四件齊備，每件東西都待在
           一個面上，腳下壓一層 8% 墨接觸影。畫面上不寫任何位置註釋：
           八人的名簽一律「面朝下」，翻過來才見稱謂（世界變化 ①）。 -->
      <g id="view-room" class="view active">
        <path class="floor" d="M36,404.4 C300,402.6 700,405.2 1164,403.6 L1164,720 L36,720 Z"/>
        <path class="l2" d="M36,404.6 C300,402.8 700,405.4 1164,403.8"/>
        <path class="l3 miter" d="M140,688 C400,686.6 800,689 1060,686.8"/>
        <path class="l1 f-wood" d="M36,396.4 C300,394.6 700,397.2 1164,395.6 L1164,404.4 C700,406.2 300,403.6 36,405.4 Z"/>
        <path class="l1 f-wood" d="M36,16.4 C420,14.6 780,17.2 1164,15.6 L1164,56.4 C780,58.2 420,55.6 36,57.4 Z"/>
        <path class="l3" d="M36,34.4 C420,32.6 780,35.2 1164,33.6"/>
        <path class="l1 f-wood" d="M116,56.4 L166,55.6 L166,398.4 L116,399.4 Z"/>

        <path class="l3" d="M132,72 L132,390 M1050,72 L1050,390"/>

        <path class="l1 f-wood" d="M508,82.4 C560,80.6 640,83.2 692,81.6 L694,138.4 C640,140.2 560,137.6 508,139.4 Z"/>
        <path class="l2" d="M520,94 C560,92.6 640,95.2 680,93.6 M520,126 C560,124.6 640,127.2 680,125.6"/>
        <text class="tx-k" x="600" y="122" font-size="22" text-anchor="middle" letter-spacing=".2em">體 仁 沐 德</text>
        <!-- 檐燈：橫披下兩盞（平塗一塊 + 一點朱）-->
        <path class="l3" d="M196,56 L196,84 M1004,56 L1004,84"/>
        <path class="l1 f-wood" d="M178,84.4 C188,82.6 204,85.2 214,83.6 L214,110.4 C204,112.2 188,109.6 178,111.4 Z"/>

        <circle cx="196" cy="122" r="6" fill="var(--zhu)"/>
        <circle cx="1004" cy="122" r="6" fill="var(--zhu)"/>
        <!-- 兩側垂簾：把牆面撐起來（不與任何熱點相交）-->

        <path class="l3" d="M204,80 L204,250 M220,80 L220,254 M236,80 L236,250"/>
        <path class="l2" style="stroke:var(--zhu)" d="M218,268 L218,288"/>
        <circle cx="218" cy="294" r="5" fill="#b9a88c"/>
        <path class="l1 f-card" d="M956,61.6 C972,63.2 992,60.6 1008,62 L1008,262 C1006,266 1000,270 992,266 C980,258 968,268 956,258 Z"/>

        <path class="l2" style="stroke:var(--zhu)" d="M982,268 L982,288"/>
        <circle cx="982" cy="294" r="5" fill="#b9a88c"/>
        <!-- 月台（正中三級之上的平台）-->
        <path class="l1 f-card" d="M330,300.4 C480,298.6 720,301.2 870,299.6 L870,404.4 C720,406.2 480,403.6 330,405.4 Z"/>
        <path class="l2" d="M330,300.6 C480,298.8 720,301.4 870,299.8"/>
        <path class="shadow" d="M336,405 C480,403.2 720,405.8 866,404.2 L866,412 C720,413.8 480,411.2 336,412.8 Z"/>
        <path class="l1 f-wood" d="M330,394.4 C480,392.6 720,395.2 870,393.6 L870,404.4 C720,406.2 480,403.6 330,405.4 Z"/>
        <path class="l1 f-card" d="M262,340.4 C278,338.6 314,341.2 330,339.6 L330,404.4 C314,406.2 278,403.6 262,405.4 Z"/>
        <path class="l3" d="M268,356 L324,354.6 M274,372 L318,370.6 M280,388 L312,386.6"/>
        <path class="l1 f-card" d="M870,339.6 C886,341.2 922,338.6 938,340.4 L938,405.4 C922,403.6 886,406.2 870,404.4 Z"/>
        <path class="l3" d="M876,354.6 L932,356 M882,370.6 L926,372 M888,386.6 L920,388"/>
        <!-- 御座前的香案：鼎焚百合之香 -->
        <path class="shadow" d="M572,404 C588,402.6 612,405.2 628,403.6 L628,410 C612,411.8 588,409.2 572,410.8 Z"/>
        <path class="l1 f-wood" d="M566,364.4 C588,362.6 612,365.2 634,363.6 L634,404.4 C612,406.2 588,403.6 566,405.4 Z"/>
        <path class="l2" d="M566,364.6 C588,362.8 612,365.4 634,363.8"/>
        <path class="l3" d="M576,378 L624,378 M580,392 L620,392"/>
        <path class="l2" d="M600,362 C595,354 605,348 599,340"/>
        <circle cx="600" cy="334" r="3" fill="var(--zhu)"/>
        <!-- 御座（座基 / 座面 / 靠背）-->
        <path class="l1 f-wood" d="M518,246.4 C560,244.6 640,247.2 682,245.6 L682,300.4 C640,302.2 560,299.6 518,301.4 Z"/>
        <path class="l1 f-card" d="M534,224.4 C566,222.6 634,225.2 666,223.6 L666,246.4 C634,248.2 566,245.6 534,247.4 Z"/>
        <path class="l1 f-wood" d="M544,152.4 C568,150.6 632,153.2 656,151.6 L656,226.4 C632,228.2 568,225.6 544,227.4 Z"/>
        <path class="l3" d="M556,166 L644,166 M556,182 L644,182"/>
        <path class="l2" d="M528,214 L544,214 M656,214 L672,214"/>
        <!-- 廊下：柱外一角（齡官候在這裡）-->
        <path class="shadow" d="M20,610 L112,608.6 L112,616 L20,617.4 Z"/>

/* ══ 4. 存讀檔（只加不改）═════════════════════════════════════════════
   寫盤時先把上一次的整個物件讀回來：f 逐鍵併（上一幕的旗一個不動），
   done 只追加、notes 只追加，inv / read / cam 三個第一幕的鍵原樣留着；
   本幕自己的物件欄／已讀／相機寫在新鍵 inv2 / read2 / cam2 上。 */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];
function markActDone(){
  if(F.f_act2_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);
}
function saveNow(){
  try{
    markActDone(); appendNotes();
    var base = {}, k;
    try{ base = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; }catch(e){ base = {}; }
    var fOut = {};
    if(base.f) for(k in base.f) fOut[k] = base.f[k];
    for(k in F) if(F[k]) fOut[k] = F[k];
    var out = {};
    for(k in base) out[k] = base[k];
    out.f = fOut;
    out.act = Math.max(base.act|0, ACT_NO);
    out.done = DONE;
    out.notes = NOTE_LOG;
    out.inv2 = INV; out.read2 = READ; out.cam2 = CAM;
    out.mis2 = MIS;
    out.ts = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(out));
  }catch(e){}
}
function saveDebounced(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    allFlagKeys().forEach(function(k){ if(k in o.f) F[k] = o.f[k]; });
    INV = o.inv2 || []; READ = o.read2 || []; CAM = o.cam2 || "room";
    if(typeof o.mis2 === "number") MIS = o.mis2;
    PEOPLE.forEach(function(p){ if(F["f_look_"+p.k]) LOOK[p.k] = 1; if(F["f_seat_"+p.k]) SEAT[p.k] = slotOfPerson(p.k); });
    KINROWS.forEach(function(r){ if(F["f_kin_"+r.k]) KIN[r.k] = r.tag; });
    return true;
  }catch(e){ return false; }
}
function slotOfPerson(k){
  for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].who === k) return SLOTS[i].id;
  return null;
}

var PAPER_OPEN = null;

/* pages = [{ title, body:[...], keys:[...] }]；pi = 頁序 */
function docDoc(pages, pi, sub, note){
  if(pi < 0) pi = 0;
  if(pi > pages.length-1) pi = pages.length-1;
  var P = pages[pi];
  PAPER_OPEN = P.title;
  clear(paperLayer);
  var W = 740, H = 536, X = 600-W/2, Y = 360-H/2;
  var g = el("g", { "class":"paper show", transform:"translate("+X+","+Y+")" });
  g.appendChild(el("rect",{ x:-4, y:-4, width:W+8, height:H+8, rx:4, "class":"shadow" }));
  g.appendChild(el("path",{ "class":"l1 f-card",
    d:"M2,2.6 C200,1 560,3.2 738,1.6 L738,"+(H-1.6)+" C560,"+(H-3.4)+" 200,"+(H-0.8)+" 2,"+(H-2.4)+" Z" }));
  g.appendChild(txt("paper-title", W/2, 46, P.title, { "text-anchor":"middle" }));
  if(sub) g.appendChild(txt("paper-sub", W/2, 70, sub, { "text-anchor":"middle" }));
  var y = 112;
  for(var i=0;i<P.body.length;i++){
    wrap(P.body[i], 32).forEach(function(seg){
      var tx = el("text",{ "class":"paper-body", x:40, y:y });
      var marks = [], cur = 0;
      (P.keys||[]).forEach(function(k){ var idx=0,p; while((p=seg.indexOf(k,idx))>=0){ marks.push([p,p+k.length]); idx=p+1; } });
      marks.sort(function(a,b){ return a[0]-b[0]; });
      marks.forEach(function(m){
        if(m[0] < cur) return;
        if(m[0] > cur){ var n1 = el("tspan"); n1.textContent = seg.slice(cur,m[0]); tx.appendChild(n1); }
        var sp = el("tspan"); sp.setAttribute("class","key"); sp.textContent = seg.slice(m[0],m[1]); tx.appendChild(sp);
        cur = m[1];
      });
      if(cur < seg.length){ var n2 = el("tspan"); n2.textContent = seg.slice(cur); tx.appendChild(n2); }
      g.appendChild(tx); y += 25;
    });
    y += 5;
  }
  if(note) g.appendChild(txt("paper-sub", 40, H-44, note, { "font-size":12.5, fill:"var(--faint)" }));
  g.appendChild(txt("paper-sub langnote", 40, note ? H-26 : H-44, LANG_NOTE, { "font-size":12.5, fill:"var(--faint)" }));
  var total = pages.length;
  /* 只有一頁時不畫頁序點 —— 一顆孤零零的朱點看着像髒東西。 */
  if(total > 1){
    for(i=0;i<total;i++){
      g.appendChild(el("circle",{ cx:(W/2 - (total-1)*16/2 + i*16), cy:H-56, r:4,
        fill:(i===pi) ? "var(--zhu)" : "none",
        stroke:(i===pi) ? "none" : "var(--faint)", "stroke-width":1 }));
    }
  }
  if(pi > 0){
    g.appendChild(txt("paper-close", 40, H-30, "◂ 前一頁", { "font-size":14 }));
    var hp = el("rect",{ x:30, y:H-48, width:96, height:30, fill:"transparent" });
    hp.setAttribute("style","cursor:pointer");
    hp.addEventListener("click", function(ev){ ev.stopPropagation(); docDoc(pages, pi-1, sub, note); });
    g.appendChild(hp);
  }
  if(pi < total-1){
    g.appendChild(txt("paper-close", W-40, H-30, "後一頁 ▸", { "font-size":14, "text-anchor":"end" }));
    var hn = el("rect",{ x:W-136, y:H-48, width:96, height:30, fill:"transparent" });
    hn.setAttribute("style","cursor:pointer");
    hn.addEventListener("click", function(ev){ ev.stopPropagation(); docDoc(pages, pi+1, sub, note); });
    g.appendChild(hn);
  }
  g.appendChild(txt("paper-close", W/2, H-12, "點紙外任意處 · 收起", { "text-anchor":"middle" }));
  g.addEventListener("click", function(ev){ ev.stopPropagation(); closePaper(); });
  paperLayer.appendChild(g);
  saveDebounced();
  syncLangNotes();
}

/* ══ 14. 鏈① 認席 —— 判定線落在「檔」上，不落在「第幾個位置」上 ═══════════ */
var TIER_SAY = {
  zhu:"御座只容一人 —— 那一位已經坐在那裏了。",
  pei:"這一席在御座左右手邊 —— 再看那位是坐着還是站着。",
  shi:"這一席在月台以下 —— 月台以上是坐着陪的，以下是站着的。",
  lang:"這一席在柱外 —— 柱外那一位，原文裏是在哪裏等的？"
};
function tierLab(id){ for(var i=0;i<TIERS.length;i++) if(TIERS[i].id === id) return TIERS[i].lab.replace(/ /g,""); return id; }
function tierOfSlot(sid){ return sid.split("_")[1]; }
function occupantOf(sid){ for(var k in SEAT) if(SEAT[k] === sid) return k; return null; }
function seatedCount(){ var n=0; PLACED_KEYS.forEach(function(k){ if(SEAT[k]) n++; }); return n; }
function pickPlate(k){
  if(!LOOK[k]){ say("這一張名簽還沒翻過來 —— 先回正殿翻它。", false, 3000); return; }
  if(SEAT[k]) return;
  give("it_plate_"+k);
  SEL = "it_plate_"+k;
  say("取了名牌　" + PEOPLE_BY[k].addr + "。", false, 2600);
  render(); saveDebounced();
}
function tapSlot(sid){
  if(occupantOf(sid)){ unseat(sid); return; }
  if(!SEL || !/^it_plate_/.test(SEL)){
    say("手邊空着 —— 先從右邊池子裏取一張牌。", false, 3000); return;
  }
  placeSeat(SEL.slice(9), sid);
}
function unseat(sid){
  var k = occupantOf(sid);
  if(!k) return;
  delete SEAT[k]; F["f_seat_"+k] = false;
  take("it_plate_"+k);
  if(SEL === "it_plate_"+k) SEL = null;
  sfx("wood"); say("牌收回池子裏。", false, 2000);
  render(); saveDebounced();
}
function placeSeat(k, sid){
  var p = PEOPLE_BY[k];
  if(!p) return;
  if(!LOOK[k]){ say("這一張名簽還沒翻過來。", false, 3000); return; }
  if(occupantOf(sid)){ say("這一席上已經有一張牌 —— 點它，牌自己回池子裏。", false, 3400); return; }
  if(p.tier !== tierOfSlot(sid)){ rejectSeat(k, sid); return; }
  SEAT[k] = sid; F["f_seat_"+k] = true;
  take("it_plate_"+k); SEL = null;
  sfx("board"); say("牌落在「" + tierLab(p.tier) + "」席上。", false, 2200);
  render(); saveDebounced();
}
function rejectSeat(k, sid){
  MIS++;
  var row = document.querySelector('.tierrow[data-tier="' + tierOfSlot(sid) + '"]');
  if(row){ row.classList.add("dimmed"); setTimeout(function(){ row.classList.remove("dimmed"); }, 780); }
  var c = POOLCELL[k] || [714,362], x = c[0], y = c[1];
  var host = D("#view-close");
  var g = el("g", { "class":"ghost", "pointer-events":"none" });
  g.appendChild(el("path", { "class":"l1 f-card",
    d:"M"+x+","+(y+1.4)+" L"+(x+212)+","+y+" L"+(x+212)+","+(y+66)+" L"+x+","+(y+67.4)+" Z" }));
  host.appendChild(g);
  setTimeout(function(){ g.classList.add("fall"); }, 20);
  setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 640);
  sfx("wood");
  say(TIER_SAY[PEOPLE_BY[k].tier] || "牌順席沿滑回池子裏。", true, 4400);
  render(); saveDebounced();
}
function sealSeat(){
  if(F.f_seat_sealed){ say("席次已經用過印。", false, 2000); return; }
  if(seatedCount() < PLACED_KEYS.length){
    say("牌還沒齊 —— 四檔席上各有其人，才用印。", false, 3600); return;
  }
  F.f_seat_sealed = true;
  D("#seal-seat").classList.add("on");
  sfx("zhu"); say("席次用印。", false, 2400);
  render(); saveDebounced();
}

/* ══ 15. 鏈② 辨親疏 —— 判定線獨立於鏈①（簽落錯時，席上的牌一張不動）═══ */
function placeKin(k, tag){
  if(!F.f_seat_sealed){ say("這一盤還沒開 —— 先認席、用印。", false, 3600); return; }
  if(KIN[k] === tag){
    delete KIN[k]; F["f_kin_"+k] = false;
    sfx("wood"); say("簽取回盤裏。", false, 1800);
    render(); saveDebounced(); return;
  }
  var row = null;
  KINROWS.forEach(function(r){ if(r.k === k) row = r; });
  if(!row || row.tag !== tag){ rejectKin(k, tag); return; }
  KIN[k] = tag; F["f_kin_"+k] = true;
  sfx("board"); say("簽落在「" + TAG_BY[tag].lab.replace(/ /g,"") + "」上。", false, 2200);
  render(); saveDebounced();
}
var KIN_SAY = {
  zong:"這一簽問的是同宗 —— 那一位在原文裏是行家禮的，還是行國禮的？",
  ke:"這一簽問的是寄居 —— 那一位進殿之前，是誰在外頭「未敢擅入」？",
  wai:"這一簽問的是席外 —— 那一位受的是略節之內的賞，還是「額外賞」？"
};
function rejectKin(k, tag){
  MIS++;
  var g = document.getElementById("kinrow-"+k);
  if(g){ g.classList.add("dimmed"); setTimeout(function(){ g.classList.remove("dimmed"); }, 780); }
  sfx("wood");
  say(KIN_SAY[tag] || "這一盤問的是親疏，不是席次。", true, 4400);
  render(); saveDebounced();
}
function sealKin(){
  if(F.f_kin_sealed){ say("親疏已經用過印。", false, 2000); return; }
  var all = true;
  KINROWS.forEach(function(r){ if(KIN[r.k] !== r.tag) all = false; });
  if(!all){ say("三簽還沒落齊 —— 三個人各一枚，才用印。", false, 3600); return; }
  F.f_kin_sealed = true;
  D("#seal-kin").classList.add("on");
  sfx("zhu"); say("親疏用印。", false, 2400);
  render(); saveDebounced();
}

/* ══ 17. 收束：省親單 ═══════════════════════════════════════════════════ */
function showBook(){
  F.f_book_seen = true;
  var rows = [], i;
  TIERS.forEach(function(t){
    var names = [];
    SLOTS.forEach(function(s){
      if(s.tier !== t.id) return;
      var k = s.who || occupantOf(s.id);

  });
  rows.push("");
  rows.push("三簽　" + KINROWS.map(function(r){

  }).join(" · "));
  rows.push("");
  rows.push("三個「原來如此」：");
  rows.push("① 老爺站着、戲子在柱外 —— 國禮壓家禮，座次就是身份。");
  rows.push("② 「在下相陪」是坐着陪的；「月台下排班」是站着的。");
  rows.push("③ 賞賜的略節之內是一等，「額外賞」在略節之外，又是一等。");

  saveNow();
}

/* ══ 21. 啟動 ═══════════════════════════════════════════════════════════ */
var SETLOG = [], TRACE = [], CLICKLOG = [], TAKELOG = [];
function boot(){
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(FRESH){
    /* #fresh 是「真從空桶起」：旗之外，done 與 notes 也要清 ——
       否則模組載入時已讀到的舊 done / notes 會跟着新一輪一起寫回去。 */
    try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(NOTES_KEY); }catch(e){}
    resetState(); DONE.length = 0; NOTE_LOG.length = 0;
  }
  else restored = load();
  if(!restored) resetState();
  /* AUTO 只清本幕自己的旗；上一幕交下來的 f / done / notes 一個不動 */
  if(AUTO) resetAct2();
  F.f_seen_act2 = true;
  render();
  setCam(CAM || "room");
  syncModal();
  setLang(LANG, true);
  if(AUTO){ showLedger(true); }
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function allLook(){ PLACED_KEYS.forEach(function(k){ LOOK[k] = 1; F["f_look_"+k] = true; }); LOOK.yuan = 1; F.f_look_yuan = true; }
  function allSeat(){
    PLACED_KEYS.forEach(function(k){
      var sid = null;
      SLOTS.forEach(function(s){ if(!sid && s.tier === PEOPLE_BY[k].tier && !(s.who) && !occupantOf(s.id)) sid = s.id; });
      if(sid){ SEAT[k] = sid; F["f_seat_"+k] = true; }
    });
  }
  function allKin(){ KINROWS.forEach(function(r){ KIN[r.k] = r.tag; F["f_kin_"+r.k] = true; }); }
  function showRoom(){ showLedger(false); F.f_seen_act2 = true; setCam("room"); render(); }
  if(PROBE){
    if(PROBE === "room"){ showRoom(); }
    else if(PROBE === "close"){ showLedger(false); allLook(); setCam("close"); render(); }
    else if(PROBE === "rule"){ showLedger(false); showRule(0); }
    else if(PROBE === "rule2"){ showLedger(false); showRule(1); }
    else if(PROBE === "src"){ showLedger(false); showSrc(0); }
    else if(PROBE === "src2"){ showLedger(false); showSrc(1); }
    else if(PROBE === "src3"){ showLedger(false); showSrc(2); }
    else if(PROBE === "src4"){ showLedger(false); showSrc(3); }
    else if(PROBE === "person2"){ showLedger(false); setCam("room"); render(); showPerson("dai"); }
    else if(PROBE === "person3"){ showLedger(false); setCam("room"); render(); showPerson("ling"); }
    else if(PROBE === "person"){ showLedger(false); setCam("room"); render(); showPerson("jia"); }
    else if(PROBE === "seated"){ showLedger(false); allLook(); allSeat(); setCam("close"); render(); }
    else if(PROBE === "seatseal"){ showLedger(false); allLook(); allSeat(); F.f_seat_sealed = true; D("#seal-seat").classList.add("on"); setCam("close"); render(); }
    else if(PROBE === "kin"){ showLedger(false); allLook(); allSeat(); F.f_seat_sealed = true; D("#seal-seat").classList.add("on"); allKin(); setCam("close"); render(); }
    else if(PROBE === "kined"){ showLedger(false); allLook(); allSeat(); F.f_seat_sealed = true; D("#seal-seat").classList.add("on"); allKin(); F.f_kin_sealed = true; D("#seal-kin").classList.add("on"); setCam("close"); render(); }
    else if(PROBE === "done"){ showLedger(false); allLook(); allSeat(); F.f_seat_sealed = true; D("#seal-seat").classList.add("on"); allKin(); F.f_kin_sealed = true; D("#seal-kin").classList.add("on"); setCam("close"); render(); showBook(); }
    else if(PROBE === "notes"){ showLedger(false); allLook(); allSeat(); F.f_seat_sealed = true; D("#seal-seat").classList.add("on"); allKin(); F.f_kin_sealed = true; D("#seal-kin").classList.add("on"); setCam("close"); render(); showNotes(); }
    else if(PROBE === "ledger"){ showLedger(true); }

/* ══ 22. 自動走通（頁內自測；**不當命中判據** —— 命中另由真鼠標走通驗）═══
   這一支只用 MouseEvent 派發，繞過瀏覽器命中判定，只證明「邏輯鏈能通」。 */
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":nohs"); return false; }
  if(n.classList.contains("gone")){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":gone"); return false; }
  if(!inActiveView(n)){ if(CLICKLOG.length<60) CLICKLOG.push(hsId+":notactive"); return false; }
  var hit = n.querySelector(".hit") || n;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function runAuto(stop){
  var log = [];
  TRACE.length = 0; CLICKLOG.length = 0; SETLOG.length = 0; TAKELOG.length = 0;
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::" + log.join(" | ")
      + " || FLAGS[" + allFlagKeys().filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + MIS
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]"
      + " || NOTES[" + NOTE_LOG.map(function(x){ return "act" + x.act + ":" + x.n; }).join(",") + "]"
      + " || TRACE[" + TRACE.join(" ; ") + "]"
      + " || CLICK[" + CLICKLOG.join(" ; ") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在司命簿", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(320);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_入席", click("h_ledger_enter")); await w(340);
    /* 採名：七張名簽逐張翻過來 */
    for(var i=0;i<PLACED_KEYS.length;i++){
      var k = PLACED_KEYS[i];
      step("3" + i + "_翻名簽_" + k, (function(kk){
        click("h_look_" + kk);
        closePaper();
        return !!LOOK[kk];
      })(k));
      await w(150);
    }
    step("4_七簽已翻", PLACED_KEYS.every(function(kk){ return !!LOOK[kk]; }));
    step("5_近前看席次", (function(){ click("h_room_close"); return CAM === "close"; })()); await w(360);
    /* 錯法一：把「老爺」擺進陪坐 */
    step("6a_取老爺牌", (function(){ click("h_plate_zheng"); return SEL === "it_plate_zheng"; })()); await w(200);
    step("6b_錯放陪坐", (function(){
      var sid = "s_pei_0";
      if(occupantOf(sid)) sid = "s_pei_1";
      click("h_slot_" + sid);
      return MIS >= 1 && !F.f_seat_zheng;
    })()); await w(420);
    step("7_老爺席仍空", !F.f_seat_zheng);
    /* 七張牌各歸其檔 */
    for(i=0;i<PLACED_KEYS.length;i++){
      (function(kk){
        step("8" + kk + "_取牌", (function(){ click("h_plate_" + kk); return SEL === "it_plate_" + kk; })());
      })(PLACED_KEYS[i]);
      await w(160);
      (function(kk){
        step("9" + kk + "_落檔", (function(){
          var t = PEOPLE_BY[kk].tier, sid = null;
          SLOTS.forEach(function(s){ if(!sid && s.tier === t && !s.who && !occupantOf(s.id)) sid = s.id; });
          click("h_slot_" + sid);
          return !!F["f_seat_" + kk];
        })());
      })(PLACED_KEYS[i]);
      await w(240);
    }
    step("10_七牌齊", seatedCount() === PLACED_KEYS.length);
    step("11_席次用印", (function(){ click("h_seat_seal"); return !!F.f_seat_sealed; })()); await w(460);
    /* 錯法二：把「黛玉」落成宗親 */
    step("12_錯落宗親", (function(){ click("h_kin_dai_zong"); return MIS >= 2 && !F.f_kin_dai; })()); await w(420);
    step("13_黛玉簽未落", !F.f_kin_dai);
    for(i=0;i<KINROWS.length;i++){
      (function(r){
        step("14" + r.k + "_落簽", (function(){ click("h_kin_" + r.k + "_" + r.tag); return !!F["f_kin_" + r.k]; })());
      })(KINROWS[i]);
      await w(220);
    }
    step("15_三簽齊", KINROWS.every(function(r){ return KIN[r.k] === r.tag; }));
    step("16_親疏用印", (function(){ click("h_kin_seal"); return !!F.f_kin_sealed; })()); await w(900);
    step("17_省親單已出", PAPER_OPEN !== null);
    step("18_收起省親單", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(200);
    step("19_收束成立", !!F.f_act2_done);
    step("20_回司命簿", (function(){ clickEl("#bk"); return LEDGER; })()); await w(360);
    step("21_校勘記", (function(){ click("h_ledger_notes"); return PAPER_OPEN === "__notes"; })()); await w(440);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(220);
    step("22_再入席", click("h_ledger_enter")); await w(340);
    step("23_本幕已畢", !!F.f_act2_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

    }
    function open(){ panel.classList.add("on"); paint(); }
    function hide(){ panel.classList.remove("on"); btn.setAttribute("aria-expanded","false"); }
    btn.addEventListener("click", function(){
      if(panel.classList.contains("on")){ hide(); return; }
      if(lv === 0){ lv = 1; var o = readAll(); o[ACT] = 1; writeAll(o); }
      open();
    });
    more.addEventListener("click", function(){
      if(lv >= 3) return;
      lv++; var o = readAll(); o[ACT] = lv; writeAll(o); paint();
    });
    closeBtn.addEventListener("click", hide);
    document.addEventListener("keydown", function(e){
      if(e.key === "h" || e.key === "H"){ if(panel.classList.contains("on")){ hide(); } else { if(lv===0){ lv=1; var o=readAll(); o[ACT]=1; writeAll(o); } open(); } }
      if(e.key === "Escape") hide();
    });
    paint();
  })();
  </script>

<script>
/* H5：首次進入提示（僅手機豎屏顯示一次，6 秒後自動消失，不阻塞舞台）*/
(function(){
  try{
    var K="honglou.mobilehint.v1";
    if(localStorage.getItem(K)) return;
    if(!window.matchMedia("(max-width:760px) and (orientation:portrait)").matches) return;
    localStorage.setItem(K,"1");
    var d=document.createElement("div");
    d.textContent="建議電腦或橫屏遊玩 · 進度自動保存";
    d.style.cssText="position:fixed;left:0;right:0;top:26px;z-index:9998;padding:6px 8px;text-align:center;background:#a63a2a;color:#f3ecdf;font-size:12px;letter-spacing:.04em";
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },6000);
  }catch(e){}
})();
</script>
