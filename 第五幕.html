<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅樓推理 · 秦可卿之死 · 靈前 · 第五幕</title>
<link rel="icon" href="favicon.ico">
<style>
  /* ══ 色板：與前四幕逐字相同 —— 9 個 token + 既有平塗舊木 #b9a88c ══
     本幕實機只用到 8 個值：paper / paper2 / card / ink / ink2 / faint / zhu / #b9a88c
     （--line 與 --line2 兩支保留在 :root 裡、全篇不用，故不入實機取值）。
     白事不用「亮底」：亮靠檐、牆、地面三個面與墨線撐出來，色板一個不加。 */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
    --l1:2.2px; --l2:1.4px; --l3:0.9px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color:var(--ink)}          /* 不設則 html 取預設黑，實機色值會多一個 rgb(0,0,0) */
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  /* ══ 窗口自適應（硬規則 ①）════════════════════════════════════════════
     舞台恆為 1200:720。寬度同時受三個上界約束：視窗寬、設計寬 1200、
     以及「視窗高 − 台賬 64 − 上下留白 24」換算過來的寬。三者取最小。 */
  #app{width:min(100%,1200px,calc((100vh - 88px) * 1.66667));display:flex;flex-direction:column;min-height:0}
  #stage{display:block;width:100%;height:auto;aspect-ratio:1200/720;background:var(--paper);overflow:hidden}
  #hud{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;
       background:var(--paper);border-top:1px solid var(--faint);padding:0 6px}
  #slots{display:flex;gap:4px}
  .slot{width:56px;height:56px;border:1px solid transparent;position:relative;cursor:default}
  .slot .under{position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:var(--faint)}
  .slot svg{display:block;width:52px;height:52px;margin:1px;transition:transform 120ms ease}
  .slot.has{cursor:pointer}
  .slot.sel{border-color:var(--zhu)}
  .slot.sel svg{transform:translateY(-2px)}
  #caption{margin-left:auto;margin-right:8px;max-width:62%;
           font-family:"Kaiti SC","STKaiti","KaiTi",serif;
           font-size:13px;line-height:1.6;color:var(--ink2);text-align:right;
           opacity:0;transition:opacity 500ms ease}
  #caption.on{opacity:1}
  #caption.zhu{color:var(--zhu)}
  /* ══ 繁／簡切換鍵（角標位）：只用既有 token，不新增顏色 ══ */
  #langbtn{
    flex:0 0 auto;margin:0 6px 0 2px;padding:5px 11px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--faint);border-radius:2px;
  }
  #langbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #langbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}

  /* ══ 線寬三級（與前四幕同值；vector-effect 保證跨視圖不漂移）══ */
  .l1{stroke:var(--ink);stroke-width:var(--l1);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l2{stroke:var(--ink2);stroke-width:var(--l2);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .l3{stroke:var(--faint);stroke-width:var(--l3);stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
  .miter{stroke-linejoin:miter}
  .f-wood{fill:#b9a88c}
  .f-card{fill:var(--card)}
  .f-paper{fill:var(--paper)}
  .f-p2{fill:var(--paper2)}
  .f-zhu{fill:var(--zhu)}
  .tx{fill:var(--ink);font-family:"Songti SC","STSong",Georgia,serif}
  .tx-k{fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .tx-z{fill:var(--zhu);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .shadow{fill:var(--ink);opacity:.08;stroke:none}
  /* 舞台內的圖元一律以 fill / stroke 取色，不用 currentColor；
     把 SVG 節點的 color 一次釘在墨色上，免得「實機取值」把瀏覽器對 SVG
     的黑色 color 預設算成第 9 個顏色。 */
  #stage, #stage *{color:var(--ink)}

  /* ══ 視圖切換（本幕 2 個圖形視圖 + 2 種紙頁）══ */
  .view{opacity:0;pointer-events:none;transition:opacity 460ms ease}
  .view.active{opacity:1;pointer-events:auto}

  /* ══ 命中（硬規則 ②）：非活動層的整棵子樹都不收鼠標 ═════════════════
     pointer-events 可繼承，但子元素一旦顯式寫值就壓過繼承；而 opacity:0
     的元素照樣參與命中測試 —— 兩者相乘，看不見的層會偷走真人的點擊。
     所以：不改任何 .hit 的既有寫法，只把非活動層整棵釘死。 */
  .view:not(.active), .view:not(.active) *,
  #ledger:not(.on), #ledger:not(.on) *,
  #bridge:not(.on), #bridge:not(.on) *,
  .paper:not(.show), .paper:not(.show) *{pointer-events:none!important}
  /* 司命簿／幕間壓在上面時，底下的場景也整棵釘死（syncModal 掛 .modal）*/
  #world.modal .view, #world.modal .view *{pointer-events:none!important}
  /* 展開中的紙頁維持原樣：自己吃鼠標，於是不會漏點到紙後面那些熱點 */
  #paper-layer{pointer-events:none}
  #paper-layer .paper.show{pointer-events:auto}

  /* ══ 熱點：默認 / 可點 / 已取 三態 ══ */
  .hs{cursor:default}
  .hs .hit{fill:transparent;stroke:none;pointer-events:all}
  .hs.on .hit{cursor:pointer}
  .hs.on:hover .art > path,.hs.on:hover .art > rect,.hs.on:hover .art > circle,
  .hs.on:hover .art > ellipse,.hs.on:hover .art > line,.hs.on:hover .art > polygon,
  .hs.on:hover .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.armed .art > path,.hs.armed .art > rect,.hs.armed .art > circle,
  .hs.armed .art > ellipse,.hs.armed .art > line,.hs.armed .art > polygon,
  .hs.armed .art > g > path{stroke:var(--zhu);stroke-width:3}
  .hs.on:hover .art > text,.hs.armed .art > text{fill:var(--zhu)}
  .hs.on:hover > text,.hs.armed > text{fill:var(--zhu)}
  .hs.gone, .hs.gone *{pointer-events:none}
  .hs.gone .art,.hs.gone > text{opacity:0}

  /* ══ 視角規格：屏幕坐標 = 正面坐標 + 深度·(0,−0.5) ══ */
  .floor{fill:var(--card);stroke:none}
  .slab{fill:var(--card);stroke:none}
  .recess{fill:var(--paper2);stroke:none}

  /* ══ 世界變化 ① 名帖入位（框裡的字才顯形）══ */
  .seatcell .inp{opacity:0;transition:opacity 340ms ease}
  .seatcell.set .inp{opacity:1}
  /* ══ 世界變化 ② 簽插到物（物下的字才顯形）══ */
  .excell .inp{opacity:0;transition:opacity 340ms ease}
  .excell.set .inp{opacity:1}
  /* ══ 世界變化 ③ 朱印 ══ */
  .seal{opacity:0;transition:opacity 420ms ease;pointer-events:none}
  .seal.on{opacity:1}
  /* ══ 世界變化 ④ 落錯時整框暗一檔（現場變化）══ */
  .seatcell,.excell,.cardcell,.signcell{transition:opacity 200ms ease}
  .seatcell.dimmed,.excell.dimmed,.cardcell.dimmed,.signcell.dimmed{opacity:.3}
  /* ══ 錯法：手上的東西抖一下（東西仍在原處）══ */
  @keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
  .shaking{animation:shake 130ms ease-in-out 2}
  /* ══ 錯法：名帖順案沿滑回、簽順匣沿滑回（現場變化，東西不消失、可立即重放）══ */
  @keyframes fall{0%{opacity:.95}100%{opacity:0}}
  .ghost{opacity:0}
  .ghost.fall{animation:fall 460ms ease-in forwards}

  /* ══ 紙（在場景內展開，不切屏、不加暗底遮罩）══ */
  .paper{opacity:0;pointer-events:none;transition:opacity 260ms ease}
  .paper.show{opacity:1;pointer-events:auto}
  .paper-title{font-size:21px;fill:var(--ink);letter-spacing:.18em}
  .paper-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  .paper-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.02em}
  .paper-body .key{font-size:18px}
  .paper-close{font-size:12px;fill:var(--faint);letter-spacing:.08em}

  /* ══ 外殼：司命簿（沿用前四幕的同一套 .led-*，只改字面）══ */
  #ledger{opacity:0;pointer-events:none;transition:opacity 420ms ease}
  #ledger.on{opacity:1;pointer-events:auto}
  .led-lede{font-size:26px;fill:var(--ink);letter-spacing:.22em}
  .led-sub{font-size:13px;fill:var(--faint);letter-spacing:.12em}
  .led-item{font-size:18px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.04em}
  .led-item.done{fill:var(--faint)}
  .led-act{font-size:21px;fill:var(--ink);letter-spacing:.2em}
  .led-hint{font-size:13px;fill:var(--faint);letter-spacing:.1em}
  #bridge{opacity:0;pointer-events:none;transition:opacity 380ms ease}
  #bridge.on{opacity:1;pointer-events:auto}
  .br-lede{font-size:22px;fill:var(--ink);letter-spacing:.2em}
  .br-body{font-size:16px;fill:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi",serif}
  .br-sub{font-size:13px;fill:var(--faint);letter-spacing:.1em}

  #boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
        justify-content:center;font-size:15px;color:var(--ink2);letter-spacing:.3em;z-index:9}
  #boot.gone{display:none}
  /* 物件說明卡：物品欄點一下，告訴你這是什麼 */
  #hud{position:relative}
  .itcard{position:absolute; left:6px; bottom:66px; max-width:430px; background:var(--card);
    border:1px solid var(--line); padding:7px 10px; font-size:12.5px; color:var(--ink);
    line-height:1.5; z-index:40}
  .itcard u{text-decoration:none; color:var(--zhu); font-size:11px; margin-right:7px}
  .itcard b{font-weight:600; letter-spacing:.04em}
  .itcard i{font-style:normal; color:var(--ink2); display:block; margin-top:2px; font-size:11.5px}

  /* v0.20.13 手机端可读性：1200x720 舞台等比缩放后字太小，竖屏时给一条提示（不改玩法） */
  @media (max-width: 760px) and (orientation: portrait) {
    body::before {
      content: "建议横屏或使用电脑游玩，字体更清晰";
      position: fixed; left: 0; right: 0; top: 0; z-index: 9999;
      padding: 6px 8px; text-align: center;
      background: #a63a2a; color: #f3ecdf; font-size: 12px; letter-spacing: .04em;
    }
    body { padding-top: 26px; }
  }

  /* ══ 三層提示（v1.1）：只用既有 9 個 token，不新增顏色 ══ */
  #hintbtn{
    position:fixed;right:12px;bottom:74px;z-index:60;
    padding:6px 12px;cursor:pointer;
    font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink2);background:var(--card);border:1px solid var(--line2);border-radius:2px;
  }
  #hintbtn:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintbtn:focus-visible{outline:1px solid var(--zhu);outline-offset:2px}
  #hintpanel{
    position:fixed;right:12px;bottom:112px;z-index:61;
    width:min(440px,calc(100vw - 24px));max-height:52vh;overflow:auto;
    background:var(--card);border:1px solid var(--line2);border-radius:2px;
    box-shadow:0 6px 24px rgba(42,38,34,.14);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    color:var(--ink);padding:12px 14px;display:none;
  }
  #hintpanel.on{display:block}
  #hintpanel h4{margin:0 0 8px;font-size:13px;letter-spacing:.14em;color:var(--zhu);font-weight:600}
  #hintpanel .lvl{margin:0 0 10px;font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
  #hintpanel .lvl b{color:var(--ink);font-weight:600}
  #hintpanel .lvl.answer{color:var(--ink)}
  #hintpanel .acts{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
  #hintpanel button{
    padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.08em;
    color:var(--ink2);background:var(--paper2);border:1px solid var(--line2);border-radius:2px;
  }
  #hintpanel button:hover{color:var(--zhu);border-color:var(--zhu)}
  #hintpanel .cnt{color:var(--faint);font-size:12px;margin-right:auto;letter-spacing:.06em}
</style>
</head>
<body>

<div id="boot">秦 可 卿 之 死</div>

<div id="app">
  <svg id="stage" viewBox="0 0 1200 720" shape-rendering="geometricPrecision"
       role="application" aria-label="紅樓推理 秦可卿之死 靈前 第五幕">
    <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
    <g id="world">

      <!-- ══════════════════ view-room：靈堂 · 一幀（全景）══════════════════════
           檐 / 牆 / 地面 / 燈 —— 四件齊備，每件東西都待在一個面上，腳下壓一層
           8% 墨接觸影。畫面裡不寫任何位置註釋、不寫任何名姓：人是誰，只在原文裡。
           靈前一具棺、一張供桌、一副靠在桌邊的拐；內室一道簾、簾後一張榻；
           檻外是廊下。五個人各在一處，姿與姿不同。 -->
      <g id="view-room" class="view active">
        <path class="f-wood" d="M-4,0 L1204,0 L1204,18 L-4,18 Z"/>
        <path class="l3" d="M-4,18 C300,16.6 900,19.2 1204,17.6"/>
        <path class="l3" d="M92,18 L92,34 M292,18 L292,34 M492,18 L492,34 M692,18 L692,34 M892,18 L892,34 M1092,18 L1092,34"/>
        <path class="f-p2" d="M-4,18 L1204,18 L1204,452 L-4,452 Z"/>
        <path class="l3" d="M-4,438 C300,436.6 900,439.2 1204,437.6"/>
        <path class="floor" d="M-4,452 C300,450.6 900,453.2 1204,451.6 L1204,720 L-4,720 Z"/>
        <path class="l2" d="M-4,452 C300,450.6 900,453.2 1204,451.6"/>
        <path class="l3" d="M-4,560 C300,558.6 900,561.2 1204,559.6"/><path class="l3" d="M-4,646 C300,644.6 900,647.2 1204,645.6"/>

        <!-- 兩盞白燈（光源）-->
        <path class="l3" d="M150,18 L150,86 M1050,18 L1050,86"/>
        <path class="l1 f-card" d="M126,86 C136,82 164,82 174,86 L170,136 C160,140 140,140 130,136 Z"/>
        <circle cx="150" cy="110" r="2.8" fill="var(--zhu)"/>
        <path class="l1 f-card" d="M1026,86 C1036,82 1064,82 1074,86 L1070,136 C1060,140 1040,140 1030,136 Z"/>
        <circle cx="1050" cy="110" r="2.8" fill="var(--zhu)"/>

        <!-- 靈幡（兩條，自檐下垂）-->
        <path class="l2" d="M300,34 L302,300"/><path class="l2" d="M900,34 L898,300"/>
        <path class="l1 f-card" d="M282,96 L322,94 L322,214 L282,216 Z"/>
        <path class="l3" d="M290,120 L314,119 M290,142 L314,141 M290,164 L314,163 M290,186 L314,185"/>
        <path class="l1 f-card" d="M878,94 L918,96 L918,216 L878,214 Z"/>
        <path class="l3" d="M886,119 L910,120 M886,141 L910,142 M886,163 L910,164 M886,185 L910,186"/>

        <!-- 棺：一具停在靈前（棺中人不可點，無 .hs）-->

/* ══ 4. 存讀檔（只加不改）═════════════════════════════════════════════
   寫盤時先把上一次的整個物件讀回來：f 逐鍵併（前四幕的旗一個不動），
   done 只追加、notes 只追加，前四幕的 inv…inv4 / read…read4 / cam…cam4
   九個鍵原樣留著；本幕自己的物件欄／已讀／相機寫在新鍵 inv5 / read5 / cam5 上。 */
var saveT = null;
var DONE = (PREV && PREV.done && PREV.done.slice) ? PREV.done.slice() : [];
var NOTE_LOG = (PREV && PREV.notes && PREV.notes.slice) ? PREV.notes.slice() : [];

  if(F.f_a5_done && DONE.indexOf(ACT_ID) < 0) DONE.push(ACT_ID);

function saveNow(){
  try{
    markActDone(); appendNotes();
    var base = {}, k;
    try{ base = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; }catch(e){ base = {}; }
    var fOut = {};
    if(base.f) for(k in base.f) fOut[k] = base.f[k];
    for(k in F) if(F[k]) fOut[k] = F[k];
    var out = {};
    for(k in base) out[k] = base[k];

/* ══ 終局摘要（只在 ?title=1 時寫進 document.title）══════════════════════
   走通驗收要的是「兩跑終局摘要相同」。摘要把兩條鏈的答案、旗、落錯次數
   一併寫成一行，兩跑只要有一位不同，SHA256 就不同。 */
var TITLE_DIGEST = /[?&]title=1/.test(location.search);

  if(!TITLE_DIGEST) return;
  document.title = "ACT5"
    + "|SEAT:" + CARD_ORDER.map(function(k){ return k+"="+(SEAT[k]||"-"); }).join(",")
    + "|EXCESS:" + EXCESS_OBJ.map(function(o){ return o.k+"="+(EXCESS[o.k]||"-"); }).join(",")
    + "|SEAL:" + (F.f_a5_seal_seat?1:0) + (F.f_a5_seal_excess?1:0)
    + "|DONE:" + DONE.join("+")
    + "|MIS:" + MIS
    + "|INV:" + INV.length
    + "|FLAGS:" + allFlagKeys().filter(function(k){ return F[k]; }).length;
}
function load(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(!o || !o.f) return false;
    allFlagKeys().forEach(function(k){ if(k in o.f) F[k] = o.f[k]; });
    INV = (o.inv5 && o.inv5.length) ? o.inv5 : startInv();
    READ = o.read5 || []; CAM = o.cam5 || "room";
    if(typeof o.mis5 === "number") MIS = o.mis5;
    /* SEAT / EXCESS 由旗還原：哪一張名帖在哪一位是 f_a5_seat_<人>（位序是死的），
       哪一支簽在哪一件物上是 f_a5_excess_<物>。兩支旗互不相干。 */
    PEOPLE.forEach(function(p){
      if(F["f_a5_seat_"+p.k]) SEAT[p.k] = SEAT_ANSWER[p.k];
    });
    EXCESS_OBJ.forEach(function(o2){ if(F["f_a5_excess_"+o2.k]) EXCESS[o2.k] = EXCESS_ANSWER[o2.k]; });
    return true;
  }catch(e){ return false; }
}

  try{

    }
    if(AC.state === "suspended") AC.resume();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(kind === "zhu"){ o.type = "triangle"; o.frequency.value = 220; g.gain.value = .05; }
    else if(kind === "board"){ o.type = "square"; o.frequency.value = 132; g.gain.value = .035; }
    else { o.type = "sine"; o.frequency.value = 96; g.gain.value = .03; }

  }catch(e){}
}

/* ══ 12. 鏈① 認位次 —— 判定線落在「哪一張名帖歸哪一處」，不讀任何逾制旗 ═
   judgeSeat(k, i) 只讀 SEAT_ANSWER 與 SLOT_TIER；
   函數體內沒有一個 EXCESS / EXCESS_ANSWER / SIGNS。 */
var SLOT = {};     /* 框序 i -> 人 k */
function judgeSeat(k, i){ return SEAT_ANSWER[k] === SLOT_TIER[i]; }
function seatSlotOf(k){ for(var i=0;i<5;i++) if(SLOT[i] === k) return i; return -1; }
function seatCount(){ var n=0; for(var i=0;i<5;i++) if(SLOT[i]) n++; return n; }
function pickCard(k){
  if(seatSlotOf(k) >= 0){
    say("這張名帖已經插在框上了 —— 點那一框，帖自己回匣裡。", false, 3400); return;
  }
  if(INV.indexOf("it_card_"+k) < 0){
    say("名帖匣裡沒有這一張。", false, 2600); return;
  }
  SEL = "it_card_" + k;
  say("取了名帖　" + PEOPLE_BY[k].full + "。", false, 2400);
  render(); saveDebounced();
}
function tapSeatCell(i){
  if(SLOT[i]){ unplaceSeat(i); return; }
  if(!SEL || !/^it_card_/.test(SEL)){
    say("手邊空著 —— 先從名帖匣裡取一張。", false, 3000); return;
  }
  placeSeatAt(SEL.slice(8), i);
}
function unplaceSeat(i){
  var k = SLOT[i];
  if(!k) return;
  delete SLOT[i]; delete SEAT[k]; F["f_a5_seat_"+k] = false;
  give("it_card_"+k);
  if(SEL === "it_card_"+k) SEL = null;
  sfx("wood"); say("帖回匣裡。", false, 2000);
  render(); saveDebounced();
}
function placeSeatAt(k, i){
  if(!PEOPLE_BY[k]) return;
  if(SLOT[i]){ say("這一框上已經有一張帖 —— 點它，帖自己回匣裡。", false, 3400); return; }
  if(!judgeSeat(k, i)){ rejectSeat(k, i); return; }
  SLOT[i] = k; SEAT[k] = SLOT_TIER[i]; F["f_a5_seat_"+k] = true;
  take("it_card_"+k); SEL = null;
  sfx("board"); say("帖插在「" + SEAT_L[i][0] + "」那一框上。", false, 2200);
  render(); saveDebounced();
}
function rejectSeat(k, i){
  MIS++;
  var cell = document.getElementById("seatcell-"+i);
  if(cell){ cell.classList.add("dimmed"); setTimeout(function(){ cell.classList.remove("dimmed"); }, 780); }
  var x = SX0 + i*SDX, y = SY;
  var host = D("#view-close");
  var g = el("g", { "class":"ghost", "pointer-events":"none", style:"transition:transform 460ms ease" });
  g.appendChild(el("path", { "class":"l1 f-card",
    d:"M"+(x+6)+","+(y+4.4)+" L"+(x+SW-6)+","+(y+3.6)+" L"+(x+SW-6)+","+(y+SH-3.6)+" L"+(x+6)+","+(y+SH-4) + " Z" }));
  g.appendChild(txt("tx-k", x+SW/2, y+112, PEOPLE_BY[k].nm, { "font-size":15, "text-anchor":"middle" }));
  host.appendChild(g);
  setTimeout(function(){ g.classList.add("fall"); g.setAttribute("transform","translate(0," + (CY-y+8) + ")"); }, 20);
  setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 700);
  sfx("wood");
  say("這一張順著案沿滑回匣裡 —— 受弔的在棺前，執事的在棺的兩側，候客的在檻外，內眷的在右首簾子後頭。", true, 4600);
  render(); saveDebounced();
}
function sealSeat(){
  if(F.f_a5_seal_seat){ say("位次已經用過印。", false, 2000); return; }
  if(seatCount() < 5){
    say("五帖還沒齊 —— 帖齊了才用印。", false, 3200); return;
  }
  F.f_a5_seal_seat = true;
  D("#seal-seat").classList.add("on");
  sfx("zhu"); say("位次用印。", false, 2400);
  render(); saveNow();
  maybeBook();
}

/* ══ 13. 鏈② 驗物 —— 判定線落在「哪一支簽歸哪一件物」，不讀任何位次旗 ═══
   judgeExcess(slot, why) 只讀 EXCESS_ANSWER；
   函數體內沒有一個 SEAT / SLOT / SEAT_ANSWER。 */
function judgeExcess(slot, why){ return EXCESS_ANSWER[slot] === why; }
function signOwner(why){ for(var s in EXCESS) if(EXCESS[s] === why) return s; return null; }
function excessCount(){ var n=0; for(var s in EXCESS) if(EXCESS[s]) n++; return n; }
function pickSign(why){
  if(signOwner(why)){
    say("這一支簽已經插在物上了 —— 點那一件，簽自己回匣裡。", false, 3400); return;
  }
  if(INV.indexOf("it_sign_"+why) < 0){
    say("簽匣裡沒有這一支。", false, 2600); return;
  }
  SEL = "it_sign_" + why;
  say("取了簽　" + SIGN_BY[why].l[0] + "。", false, 2400);
  render(); saveDebounced();
}
function tapExcess(slot){
  if(EXCESS[slot]){ unplaceExcess(slot); return; }
  if(!SEL || !/^it_sign_/.test(SEL)){
    say("手邊空著 —— 先從簽匣裡取一支。", false, 3000); return;
  }
  placeExcessAt(slot, SEL.slice(8));
}
function unplaceExcess(slot){
  var why = EXCESS[slot];
  if(!why) return;
  delete EXCESS[slot]; F["f_a5_excess_"+slot] = false;
  give("it_sign_"+why);
  if(SEL === "it_sign_"+why) SEL = null;
  sfx("wood"); say("簽回匣裡。", false, 2000);
  render(); saveDebounced();
}
function placeExcessAt(slot, why){
  if(!EXCESS_BY[slot] || !SIGN_BY[why]) return;
  if(EXCESS[slot]){ say("這一件上已經有一支簽 —— 點它，簽自己回匣裡。", false, 3400); return; }
  if(!judgeExcess(slot, why)){ rejectExcess(slot, why); return; }
  EXCESS[slot] = why; F["f_a5_excess_"+slot] = true;
  take("it_sign_"+why); SEL = null;
  sfx("board"); say("簽插在「" + EXCESS_BY[slot].nm + "」那一件上。", false, 2200);
  render(); saveDebounced();
}
function rejectExcess(slot, why){
  MIS++;
  var cell = document.getElementById("excell-"+slot);
  if(cell){ cell.classList.add("dimmed"); setTimeout(function(){ cell.classList.remove("dimmed"); }, 780); }
  var i = OBJ_ORDER.indexOf(slot); if(i < 0) i = 0;
  var x = OX0 + i*ODX, y = OY;
  var host = D("#view-close");
  var g = el("g", { "class":"ghost", "pointer-events":"none", style:"transition:transform 460ms ease" });
  g.appendChild(el("path", { "class":"l1 f-card",
    d:"M"+(x+8)+","+(y+4.4)+" L"+(x+OW-8)+","+(y+3.6)+" L"+(x+OW-8)+","+(y+OH-3.6)+" L"+(x+8)+","+(y+OH-4) + " Z" }));
  g.appendChild(txt("tx-k", x+OW/2, y+62, SIGN_BY[why].l[0], { "font-size":13, "text-anchor":"middle" }));
  host.appendChild(g);
  setTimeout(function(){ g.classList.add("fall"); g.setAttribute("transform","translate(" + (GX0-x) + "," + (GY-y+8) + ")"); }, 20);
  setTimeout(function(){ if(g.parentNode) g.parentNode.removeChild(g); }, 700);
  sfx("wood");
  say("這一支簽從物上滑落 —— 棺在供桌後頭，拐靠在桌的右手邊，朱牌對豎在門外。", true, 4600);
  render(); saveDebounced();
}
function sealExcess(){
  if(F.f_a5_seal_excess){ say("逾制已經用過印。", false, 2000); return; }
  if(excessCount() < 3){
    say("三簽還沒齊 —— 簽齊了才用印。", false, 3200); return;
  }

  D("#seal-excess").classList.add("on");

}

function noteEntries(){
  return [
    { act:5, n:"位次", t:"這一回寫位次，全是動作：拄拐踱進來、款款站起來、睡在床上、領憑回來、在側問話。姿態是現場，姓名只在原文那一句裡。" },
    { act:5, n:"逾制", t:"逾制三處都在第十三回之內：棺板、誥封、喪主之杖。以銀捐官的那一段與棺板那一段之間隔著一大段僧道法事，兩處不相連。" },
    { act:5, n:"字形", t:"底本作「宁國府」（不作「寧」）、「听了」（不作「聽」）、「什么」「怎么」（不作「麼」），並有缺字方框「□」若干；本幕引文一律照抄，不規範化、不補字。" }
  ];
}
function appendNotes(){
  var want = noteEntries(), i, j, found;
  for(i=0;i<want.length;i++){
    found = false;
    for(j=0;j<NOTE_LOG.length;j++){
      if(NOTE_LOG[j] && NOTE_LOG[j].act === 5 && NOTE_LOG[j].n === want[i].n) found = true;
    }
    if(!found && F.f_a5_done) NOTE_LOG.push(want[i]);
  }
}
function showNotes(){ notePage = 0; renderNotePage(); }
var notePage = 0;
function wrapLines(b, n){
  var out = [], i, j, ln;
  for(i=0;i<b.length;i++){
    ln = b[i];
    if(ln.length <= n){ out.push(ln); continue; }
    for(j=0;j<ln.length;j+=n) out.push(ln.slice(j, j+n));
  }
  return out;
}
function renderNotePage(){
  var pages = [], all = NOTE_LOG.slice();
  if(!all.length) all = noteEntries();
  var chunk = [];
  all.forEach(function(e, i){
    chunk.push("#第 " + (e.act|0) + " 幕 · " + (e.n||""));
    chunk.push("　　" + (e.t||""));
    if(chunk.length >= 24){ pages.push(chunk); chunk = []; }
  });
  if(chunk.length) pages.push(chunk);
  var P = pages.map(function(b, i){ return { k:"notes" + i, t:"校 勘 記", b:wrapLines(b, 44) }; });
  docDoc(P, Math.min(notePage, P.length - 1), "凡例：引文逐字，字形不規範化", "前四幕的條目原樣留著，本幕只在後面追加。");
}

function figUse(host, sym, x, y, s){
  var dim = SYMDIM[sym] || [80,170];
  var png = FIGSPR[sym], node;
  if(png){
    node = el("g", { "transform":"translate(" + x + "," + y + ") scale(" + s + ")", "pointer-events":"none" });
    node.appendChild(el("image", { fill:"none", href:png, x:0, y:0,
      width:dim[0], height:dim[1], preserveAspectRatio:"none" }));
  } else {
    node = el("use", { "href":"#" + sym, width:dim[0], height:dim[1] });
    node.setAttribute("transform", "translate(" + x + "," + y + ") scale(" + s + ")");
  }
  host.appendChild(node);
  return node;
}
function footShadow(host, x, y, w){
  host.appendChild(el("ellipse", { "class":"shadow", cx:x, cy:y, rx:w, ry:5 }));
}
function renderRoomFigs(){
  var far = D("#figs-far"), near = D("#figs-near"), srv = D("#figs-servants");
  clear(far); clear(near); clear(srv);
  /* 靈前一帶（棺與供桌之前）*/
  footShadow(far, 392, 576, 36); figUse(far, "sym_fig", 356, 440, .80);   /* 拄拐的那一位 */
  footShadow(far, 722, 578, 34); figUse(far, "sym_arm", 688, 450, .76);   /* 立著、手裡按冊 */
  footShadow(far, 828, 580, 26); figUse(far, "sym_fig", 810, 484, .56);   /* 在側的那一位 */
  /* 檻外（廊下，靠前）*/
  footShadow(near, 236, 704, 44); figUse(near, "sym_stand", 196, 552, .88); /* 剛領憑回來 */
  /* 內室：簾後的榻 */
  figUse(srv, "sym_lying", 992, 340, .78);
  footShadow(srv, 1052, 436, 48);
  /* 兩個媳婦丫頭（不可點，無 .hs）*/
  figUse(srv, "sym_maid", 566, 496, .72);
  figUse(srv, "sym_maid", 480, 500, .68);
  /* 靈前的一根拐（靠在供桌右手邊）*/
}
function renderRoom(){ renderRoomFigs(); }
function renderClose(){ renderSeatCells(); renderCardBox(); renderExcessCells(); renderSignBox(); }

/* 鏈① 五個空框 */
function renderSeatCells(){
  var host = D("#seat-cells"); if(!host) return;
  clear(host);
  for(var i=0;i<5;i++){
    var x = SX0 + i*SDX, y = SY;
    var cell = el("g", { "class":"hs on seatcell" + (SLOT[i] ? " set" : ""),
      id:"seatcell-"+i, "data-hs":"h_slot_"+i });
    cell.appendChild(el("rect", { "class":"hit", x:x-2, y:y-2, width:SW+4, height:SH+4 }));
    var art = el("g", { "class":"art" });
    art.appendChild(el("path", { "class":"recess",
      d:"M"+x+","+(y+4.4)+" L"+(x+SW)+","+(y+3.6)+" L"+(x+SW)+","+(y+SH-4.4)+" L"+x+","+(y+SH-3.6)+" Z" }));
    art.appendChild(el("path", { "class":"l2", d:"M"+x+","+(y+SH-3.6)+" L"+(x+SW)+","+(y+SH-4.4) }));
    art.appendChild(txt("tx-k", x+SW/2, y+36, SEAT_L[i][0], { "font-size":14, "text-anchor":"middle" }));
    art.appendChild(txt("tx-k", x+SW/2, y+60, SEAT_L[i][1], { "font-size":12, "text-anchor":"middle", fill:"var(--ink2)" }));
    var inp = el("g", { "class":"inp", id:"in-seat-"+i });
    if(SLOT[i]){
      inp.appendChild(el("path", { "class":"l1 f-paper",
        d:"M"+(x+28)+","+(y+82.4)+" L"+(x+SW-28)+","+(y+82)+" L"+(x+SW-28)+","+(y+128.4)+" L"+(x+28)+","+(y+129) + " Z" }));
      inp.appendChild(txt("tx-z", x+SW/2, y+112, PEOPLE_BY[SLOT[i]].full, { "font-size":16, "text-anchor":"middle" }));
    }
    art.appendChild(inp);
    cell.appendChild(art);
    host.appendChild(cell);
  }
}
/* 名帖匣 */
function renderCardBox(){
  var host = D("#card-box"); if(!host) return;
  clear(host);
  CARD_ORDER.forEach(function(k, i){
    if(seatSlotOf(k) >= 0) return;
    var x = CX0 + i*CDX, y = CY;
    var g = el("g", { "class":"hs on cardcell", "data-hs":"h_card_"+k, id:"hs_card_"+k });
    g.appendChild(el("rect", { "class":"hit", x:x, y:y, width:CW, height:CH }));
    var art = el("g", { "class":"art" });
    art.appendChild(el("path", { "class":"l1 f-card",
      d:"M"+x+","+(y+1.4)+" L"+(x+CW)+","+y+" L"+(x+CW)+","+(y+CH-1.4)+" L"+x+","+(y+CH) + " Z" }));
    art.appendChild(txt("tx-k", x+CW/2, y+30, PEOPLE_BY[k].full, { "font-size":15, "text-anchor":"middle" }));
    art.appendChild(txt("tx-k", x+CW/2, y+50, "＋", { "font-size":12, "text-anchor":"middle", fill:"var(--faint)" }));
    g.appendChild(art);
    host.appendChild(g);
  });
}
/* 鏈② 三件物 */
function renderExcessCells(){
  var host = D("#excess-cells"); if(!host) return;
  clear(host);
  EXCESS_OBJ.forEach(function(o, i){
    var x = OX0 + i*ODX, y = OY;
    var cell = el("g", { "class":"hs on excell" + (EXCESS[o.k] ? " set" : ""),
      id:"excell-"+o.k, "data-hs":"h_ex_"+o.k });
    cell.appendChild(el("rect", { "class":"hit", x:x-2, y:y-2, width:OW+4, height:OH+4 }));

function onHotspot(id){
  if(id === "h_paper_prev" || id === "h_paper_next"){
    var d = (id === "h_paper_next") ? 1 : -1, pi = PAPER_PI + d;
    if(PAPER_OPEN === "book") return;
    if(/^rule/.test(PAPER_OPEN || "")) showRule(pi);
    else if(/^src/.test(PAPER_OPEN || "")) showSrc(pi);
    else if(/^notes/.test(PAPER_OPEN || "")){ notePage = pi; renderNotePage(); }
    return;
  }
  if(PAPER_OPEN){ closePaper(); }
  if(id === "h_ledger_bridge"){ openBridge(); return; }
  if(id === "h_bridge_go"){ closeBridge(); showLedger(false); setCam("room"); return; }
  if(id === "h_bridge_back"){ closeBridge(); showLedger(true); return; }
  if(id === "h_ledger_enter"){ showLedger(false); setCam("room"); return; }
  if(id === "h_ledger_notes"){ showNotes(); return; }
  if(id === "h_room_rule" || id === "h_close_rule"){ showRule(0); return; }
  if(id === "h_room_src" || id === "h_close_src"){ showSrc(0); return; }
  if(id === "h_room_close"){ showLedger(false); goClose(); return; }
  if(id === "h_close_room"){ goRoom(); return; }
  if(id === "h_seal_seat"){ sealSeat(); return; }
  if(id === "h_seal_excess"){ sealExcess(); return; }
  var m;
  if((m = /^h_slot_(\d)$/.exec(id))){ tapSeatCell(+m[1]); return; }
  if((m = /^h_card_([a-z]+)$/.exec(id))){ pickCard(m[1]); return; }
  if((m = /^h_ex_([a-z]+)$/.exec(id))){ tapExcess(m[1]); return; }
  if((m = /^h_sign_([a-z]+)$/.exec(id))){ pickSign(m[1]); return; }
}

stage.addEventListener("click", function(e){

/* ══ 19. 啟動 ══════════════════════════════════════════════════════════ */
function boot(){
  var restored = false;
  var AUTO = (location.hash.match(/auto=([a-z0-9]+)/i)||[])[1];
  var FRESH = /fresh/.test(location.hash);
  if(FRESH){
    try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(NOTES_KEY); }catch(e){}
    resetState(); DONE.length = 0; NOTE_LOG.length = 0;
  }
  else restored = load();
  if(!restored) resetState();
  if(AUTO) resetAct5();
  F.f_a5_seen = true;
  render();
  setCam(CAM || "room");
  if(!restored && !AUTO) showLedger(true);
  else if(restored && !AUTO) showLedger(false);
  syncModal();
  setLang(LANG, true);
  var PROBE = (location.search.match(/[?&]probe=([a-z0-9_]+)/i)||[])[1];
  if(/[?&]still=1/.test(location.search)){
    var st = document.createElement("style");
    st.textContent = "*{transition-duration:0s!important;animation-delay:0s!important}";
    document.head.appendChild(st);
  }
  function seatAll(){
    SLOT = {}; SEAT = {};
    CARD_ORDER.forEach(function(k){
      for(var i=0;i<5;i++){
        if(SLOT[i]) continue;
        if(SLOT_TIER[i] === SEAT_ANSWER[k]){ SLOT[i] = k; SEAT[k] = SEAT_ANSWER[k]; F["f_a5_seat_"+k] = true; return; }
      }
    });
  }
  function exAll(){
    EXCESS_OBJ.forEach(function(o){ EXCESS[o.k] = EXCESS_ANSWER[o.k]; F["f_a5_excess_"+o.k] = true; });
  }
  if(PROBE){
    if(PROBE === "room"){ showLedger(false); setCam("room"); render(); }
    else if(PROBE === "close"){ showLedger(false); setCam("close"); render(); }
    else if(PROBE === "rule"){ showLedger(false); showRule(0); }
    else if(PROBE === "rule2"){ showLedger(false); showRule(1); }
    else if(PROBE === "src1"){ showLedger(false); showSrc(0); }
    else if(PROBE === "src2"){ showLedger(false); showSrc(1); }
    else if(PROBE === "notes"){ showLedger(false); showNotes(); }
    else if(PROBE === "ledger"){ showLedger(true); }
    else if(PROBE === "bridge"){ showLedger(false); setCam("room"); render(); openBridge(); }
    else if(PROBE === "seathalf"){
      showLedger(false); setCam("close");
      ["zhen","feng","bao"].forEach(function(k){
        for(var i=0;i<5;i++){
          if(SLOT[i]) continue;
          if(SLOT_TIER[i] === SEAT_ANSWER[k]){ SLOT[i] = k; SEAT[k] = SEAT_ANSWER[k]; F["f_a5_seat_"+k] = true; return; }
        }
      });
      render();
    }
    else if(PROBE === "seatsealed"){
      showLedger(false); setCam("close"); seatAll(); F.f_a5_seal_seat = true;
      D("#seal-seat").classList.add("on"); render();
    }
    else if(PROBE === "exhalf"){
      showLedger(false); setCam("close"); EXCESS.guan = "qinwang"; F.f_a5_excess_guan = true; render();
    }
    else if(PROBE === "exsealed"){
      showLedger(false); setCam("close"); exAll(); F.f_a5_seal_excess = true;
      D("#seal-excess").classList.add("on"); render();
    }
    else if(PROBE === "done"){
      showLedger(false); seatAll(); F.f_a5_seal_seat = true; D("#seal-seat").classList.add("on");
      exAll(); F.f_a5_seal_excess = true; D("#seal-excess").classList.add("on");
      setCam("close"); render(); showBook();
    }
    else if(PROBE === "indep"){ showLedger(false); setCam("close"); render(); }
  }
  requestAnimationFrame(function(){ D("#boot").classList.add("gone"); });
  if(AUTO) runAuto(AUTO);
  else if(restored) say("接著上次的地方。", false, 2400);
}

/* ══ 20. 自動走通（頁內自測；**不當命中判據** —— 命中另由真鼠標走通驗）═══
   這一支只用 MouseEvent 派發，繞過瀏覽器命中判定，只證明「邏輯鏈能通」。
   它另有一個用途：跨幕測試要 act4 也在同一個桶裡走完一次。 */
var CLICKLOG = [];
function click(hsId){
  var n = document.querySelector('.hs[data-hs="'+hsId+'"]');
  if(!n){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":nohs"); return false; }
  if(n.classList.contains("gone")){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":gone"); return false; }
  if(!inActiveView(n)){ if(CLICKLOG.length<80) CLICKLOG.push(hsId+":notactive"); return false; }
  var hit = n.querySelector(".hit") || n;
  hit.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function clickEl(sel){
  var n = document.querySelector(sel);
  if(!n) return false;
  n.dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true}));
  return true;
}
function w(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function runAuto(stop){
  var log = [];
  CLICKLOG.length = 0;
  function step(name, ok){ log.push(name + "=" + (ok ? "ok" : "MISS")); }
  function report(){
    document.title = "SELFTEST::ACT5::" + log.join(" | ")
      + " || FLAGS[" + allFlagKeys().filter(function(k){ return F[k]; }).join(",") + "]"
      + " || misplaced=" + MIS
      + " || INV[" + INV.join(",") + "] || CAM=" + CAM
      + " || SEAT[" + CARD_ORDER.map(function(k){ return k+":"+(SEAT[k]||"-"); }).join(",") + "]"
      + " || EXCESS[" + EXCESS_OBJ.filter(function(o){ return EXCESS[o.k]; }).map(function(o){ return o.k+":"+EXCESS[o.k]; }).join(",") + "]"
      + " || READ[" + READ.join(",") + "]"
      + " || DONE[" + DONE.join(",") + "]"
      + " || NOTES[" + NOTE_LOG.map(function(x){ return "act" + x.act + ":" + x.n; }).join(",") + "]"
      + " || CLICK[" + CLICKLOG.join(" ; ") + "]";
    document.body.setAttribute("data-selftest", log.join(" | "));
  }
  try{
    if(stop === "ledger"){ step("停在司命簿", LEDGER); report(); return; }
    step("0_讀幕間", click("h_ledger_bridge")); await w(320);
    step("1_收起幕間", click("h_bridge_go")); await w(340);
    if(stop === "bridge"){ step("停在幕間", true); report(); return; }
    step("2_入靈前", click("h_ledger_enter")); await w(340);
    step("3_近前看靈前", click("h_room_close")); await w(360);
    if(stop === "close"){ step("停在近景", CAM === "close"); report(); return; }
    /* 鏈①：前四位，按其位次落帖 */
    var ORDER = [["zhen",0],["feng",1],["bao",2]];
    for(var i=0;i<ORDER.length;i++){
      var k = ORDER[i][0], s = ORDER[i][1];
      (function(kk, ss){
        step("4" + ss + "_取帖_" + kk, (function(){ click("h_card_"+kk); return SEL === "it_card_"+kk; })());
      })(k, s);
      await w(160);
      (function(kk, ss){
        step("5" + ss + "_入框_" + kk, (function(){ click("h_slot_"+ss); return SLOT[ss] === kk; })());
      })(k, s);
      await w(200);
    }
    /* 錯法：尤氏的帖往「拄拐」那一框上放（那一框是靈前受弔的）*/
    step("6a_取尤氏帖", (function(){ click("h_card_you"); return SEL === "it_card_you"; })()); await w(180);
    step("6b_錯落靈前", (function(){ click("h_slot_3"); return MIS >= 1 && !SLOT[3]; })()); await w(420);
    step("6c_尤氏歸內室", (function(){ click("h_slot_4"); return SLOT[4] === "you"; })()); await w(240);
    step("6d_card_rong", (function(){ click("h_card_rong"); return SEL === "it_card_rong"; })()); await w(180);
    step("6e_rong_in", (function(){ click("h_slot_3"); return SLOT[3] === "rong"; })()); await w(240);
    step("7_五帖齊", seatCount() === 5);
    step("8_位次用印", (function(){ click("h_seal_seat"); return !!F.f_a5_seal_seat; })()); await w(460);
    if(stop === "seatsealed"){ step("停在位次用印", !!F.f_a5_seal_seat); report(); return; }
    /* 鏈②：先落錯一支（一千五百兩往棺上放）*/
    step("10a_取一千五百兩", (function(){ click("h_sign_juan"); return SEL === "it_sign_juan"; })()); await w(180);
    step("10b_錯落棺", (function(){ click("h_ex_guan"); return MIS >= 2 && !EXCESS.guan; })()); await w(420);
    step("11a_壞親王的板", (function(){ click("h_sign_qinwang"); return SEL === "it_sign_qinwang"; })()); await w(160);
    step("11b_落棺", (function(){ click("h_ex_guan"); return EXCESS.guan === "qinwang"; })()); await w(200);
    step("12a_一千五百兩", (function(){ click("h_sign_juan"); return SEL === "it_sign_juan"; })()); await w(160);
    step("12b_落朱牌", (function(){ click("h_ex_pai"); return EXCESS.pai === "juan"; })()); await w(200);
    step("13a_公公拄拐", (function(){ click("h_sign_gonggong"); return SEL === "it_sign_gonggong"; })()); await w(160);
    step("13b_落拐", (function(){ click("h_ex_zhang"); return EXCESS.zhang === "gonggong"; })()); await w(200);
    step("14_三簽齊", excessCount() === 3);
    step("15_逾制用印", (function(){ click("h_seal_excess"); return !!F.f_a5_seal_excess; })()); await w(1100);
    step("16_一幀單已出", PAPER_OPEN !== null);
    step("17_收起一幀單", (function(){ closePaper(); return PAPER_OPEN === null; })()); await w(200);
    step("18_收束成立", !!F.f_a5_done);
    step("19_回司命簿", (function(){ clickEl("#bk"); return LEDGER; })()); await w(360);
    step("20_校勘記", (function(){ click("h_ledger_notes"); return /^notes/.test(PAPER_OPEN||""); })()); await w(440);
    if(stop === "notes"){ report(); return; }
    closePaper(); await w(220);
    step("21_再入靈前", click("h_ledger_enter")); await w(340);
    step("22_本幕已畢", !!F.f_a5_done);
  }catch(err){ log.push("ERR=" + (err && err.message)); }
  report();
}

/* ══ 21. 對外的只讀探針（＋獨立性測試用的兩個寫入口）═══════════════════════
   judgeSeatTable / judgeExcessTable 各看各的答案表；testSet 只給 _act5 的
   獨立性腳本用，用來把兩條鏈的答案交叉灌進去，看對方是否跟著動。 */
window.__dd = {
  F:function(){ return F; }, INV:function(){ return INV; }, DONE:function(){ return DONE; },
  CAM:function(){ return CAM; }, SEAT:function(){ return SEAT; }, EXCESS:function(){ return EXCESS; },
  SLOT:function(){ return SLOT; }, MIS:function(){ return MIS; }, READ:function(){ return READ; },
  judgeSeat:judgeSeat, judgeExcess:judgeExcess,
  SEAT_ANSWER:SEAT_ANSWER, EXCESS_ANSWER:EXCESS_ANSWER, SLOT_TIER:SLOT_TIER,
  judgeSeatTable:function(){
    var o = {};
    CARD_ORDER.forEach(function(k){ o[k] = (SEAT[k] !== undefined && SEAT[k] === SEAT_ANSWER[k]); });
    return o;
  },
  judgeExcessTable:function(){
    var o = {};
    EXCESS_OBJ.forEach(function(x){ o[x.k] = (EXCESS[x.k] !== undefined && EXCESS[x.k] === EXCESS_ANSWER[x.k]); });
    return o;
  },
  testSet:function(seatMap, exMap){
    SLOT = {}; SEAT = {};
    if(seatMap) for(var k in seatMap){
      for(var i=0;i<5;i++){
        if(SLOT[i]) continue;
        if(SLOT_TIER[i] === seatMap[k]){ SLOT[i] = k; SEAT[k] = seatMap[k]; break; }
      }
      F["f_a5_seat_"+k] = !!seatMap[k];
    }
    EXCESS = {};
    if(exMap) for(var s in exMap){ EXCESS[s] = exMap[s]; F["f_a5_excess_"+s] = !!exMap[s]; }
    render();
    return true;
  },
  click:click, setCam:setCam, auto:runAuto, goRoom:goRoom, goClose:goClose,
  closePaper:closePaper, inActiveView:inActiveView, showLedger:showLedger,
  showRule:showRule, showSrc:showSrc, showNotes:showNotes,
  state:function(){ return { F:F, INV:INV, CAM:CAM, SEL:SEL, DONE:DONE, READ:READ,
    SEAT:SEAT, EXCESS:EXCESS, SLOT:SLOT, MIS:MIS, NOTES:NOTE_LOG, PAPER_id:PAPER_OPEN }; }
};
window.showLedger = showLedger;
window.render = render;
window.goRoom = goRoom; window.goClose = goClose; window.closePaper = closePaper;
window.CAM = function(){ return CAM; };
window.SEAT = function(){ return SEAT; };
window.EXCESS = function(){ return EXCESS; };

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();

      {k:"L1（方向）", v:"喪儀盛大，處處逾制。先讀第 13 回喪事一段，留意棺木、職銜、儀仗三處「過頭」的地方，以及送喪位次。"},
      {k:"L2（定位）", v:"第 13 回：賈珍擇棺、賈蓉捐「龍禁尉」虛銜、出殯儀仗排場——三處逾制皆在此回之內。位次按喪禮尊卑對照。"},
      {k:"L3（本幕答案）", v:"第 13 回逾制三處：① 棺木用的是原為義忠親王老千歲備下的板材（薛蟠所薦）② 賈蓉捐五品「龍禁尉」虛銜 ③ 喪儀排場逾於其份。位次：賈珍主喪，尤氏、鳳姐協理，尊卑分明。"}
    ];
    function readAll(){
      try{ var o = JSON.parse(localStorage.getItem(KEY)||"{}"); return (o && typeof o==="object") ? o : {}; }catch(e){ return {}; }
    }
    function writeAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
    var lv = +(readAll()[ACT] || 0);
    var btn = document.getElementById("hintbtn"),
        panel = document.getElementById("hintpanel"),
        body = document.getElementById("hintbody"),
        cnt = document.getElementById("hintcnt"),
        more = document.getElementById("hintmore"),
        closeBtn = document.getElementById("hintclose");
    function paint(){
      var html = "";
      for(var i=0;i<lv;i++){
        html += '<p class="lvl' + (i===2?' answer':'') + '"><b>' + L[i].k + '</b><br>' + L[i].v + '</p>';
      }
      body.innerHTML = html;
      cnt.textContent = lv ? ("已展開 " + lv + "/3") : "卡住了再點一級";
      more.textContent = lv >= 3 ? "答案已顯示" : (lv === 0 ? "看第一級提示" : "再提示一級");
      more.disabled = lv >= 3;
      more.style.opacity = lv >= 3 ? ".45" : "1";
      btn.setAttribute("aria-expanded", panel.classList.contains("on") ? "true" : "false");
    }
    function open(){ panel.classList.add("on"); paint(); }
    function hide(){ panel.classList.remove("on"); btn.setAttribute("aria-expanded","false"); }
    btn.addEventListener("click", function(){
      if(panel.classList.contains("on")){ hide(); return; }
      if(lv === 0){ lv = 1; var o = readAll(); o[ACT] = 1; writeAll(o); }
      open();
    });
    more.addEventListener("click", function(){
      if(lv >= 3) return;
      lv++; var o = readAll(); o[ACT] = lv; writeAll(o); paint();
    });
    closeBtn.addEventListener("click", hide);
    document.addEventListener("keydown", function(e){
      if(e.key === "h" || e.key === "H"){ if(panel.classList.contains("on")){ hide(); } else { if(lv===0){ lv=1; var o=readAll(); o[ACT]=1; writeAll(o); } open(); } }
      if(e.key === "Escape") hide();
    });
    paint();
  })();
  </script>

<script>
/* H5：首次進入提示（僅手機豎屏顯示一次，6 秒後自動消失，不阻塞舞台）*/
(function(){
  try{
    var K="honglou.mobilehint.v1";
    if(localStorage.getItem(K)) return;
    if(!window.matchMedia("(max-width:760px) and (orientation:portrait)").matches) return;
    localStorage.setItem(K,"1");
    var d=document.createElement("div");
    d.textContent="建議電腦或橫屏遊玩 · 進度自動保存";
    d.style.cssText="position:fixed;left:0;right:0;top:26px;z-index:9998;padding:6px 8px;text-align:center;background:#a63a2a;color:#f3ecdf;font-size:12px;letter-spacing:.04em";
    document.body.appendChild(d);
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },6000);
  }catch(e){}
})();
</script>
