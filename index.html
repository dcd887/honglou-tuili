<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>紅樓推理 · 五幕合卷</title>
<style>
  /* ══ 色板：與五幕逐字同一套（9 token + 既有平塗 #b9a88c）══════════════
     本頁只用其中 8 個取值的組合：paper/paper2/card/ink/ink2/faint/zhu/line */
  :root{
    --paper:#f3ecdf; --paper2:#eae1d0; --card:#faf6ec;
    --ink:#2a2622; --ink2:#5c554b; --faint:#8d8577;
    --zhu:#a63a2a; --line:#d3c8b4; --line2:#c0b49d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color:var(--ink)}          /* 不設則 html 取預設黑，實機色值會多出一個 rgb(0,0,0) */
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Songti SC","STSong",Georgia,"Noto Serif SC",serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  /* 窗口自適應：與五幕同一條三上界公式；高度由 1200:720 定，故永遠不超出 (100vh-88) */
  #app{
    width:min(100%,1200px,calc((100vh - 88px) * 1.66667));
    aspect-ratio:1200/720; max-height:calc(100vh - 88px);
    display:flex; flex-direction:column; min-height:0; gap:6px;
  }
  header{flex:0 0 auto; display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:6px}
  header h1{font-size:24px; font-weight:600; letter-spacing:.12em}
  header .sub{font-size:12px; color:var(--faint); letter-spacing:.04em}
  header .rom{flex:0 0 auto; font-size:11px; color:var(--faint); border:1px solid var(--line); padding:1px 6px}

  #grid{flex:1 1 auto; display:flex; flex-direction:column; gap:6px; min-height:0; overflow:hidden}
  .row{
    flex:1 1 0; min-height:0;
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line);
    padding:6px 12px; text-decoration:none; color:inherit;
    transition:background .18s ease, border-color .18s ease;
  }
  .row:hover,.row:focus{background:var(--paper2); border-color:var(--faint); outline:none}
  .row .no{flex:0 0 34px; font-size:20px; color:var(--zhu); text-align:center}
  .row .nm{flex:1 1 auto; min-width:0}
  .row .nm b{display:block; font-size:16px; font-weight:600; letter-spacing:.06em}
  .row .nm i{display:block; font-size:11.5px; color:var(--ink2); font-style:normal; margin-top:1px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .st{flex:0 0 auto; font-size:11.5px; padding:2px 8px; border:1px solid var(--line); color:var(--ink2)}
  .row .st.done{color:var(--zhu); border-color:var(--line2); background:var(--paper2)}
  .row .st.run{color:var(--ink); border-color:var(--faint)}
  .row .go{flex:0 0 auto; font-size:12.5px; color:var(--zhu); letter-spacing:.08em}

  footer{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
         border-top:1px solid var(--line); padding-top:6px; font-size:11.5px; color:var(--faint)}
  footer .hint{color:var(--ink2)}
  #next{font:inherit; font-size:12.5px; color:var(--paper); background:var(--zhu); border:none;
        padding:4px 12px; cursor:pointer; letter-spacing:.08em}
  #next:hover{background:var(--ink)}
  #next[disabled]{background:var(--line2); color:var(--paper2); cursor:default}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>紅樓推理</h1>
    <div class="sub">五幕合卷 · 底本 程甲本（PG24264）· 單底本，不用脂本</div>
    <div class="rom">v1</div>
  </header>

  <main id="grid"><!-- 五幕由腳本生成 --></main>

  <footer>
    <div class="hint" id="hint">選一幕入內；也可以按 1–5 鍵。</div>
    <a href="人物小传.html" style="color:var(--zhu);text-decoration:none;letter-spacing:.06em">人物小傳</a>
    <button id="next" type="button">續上一次</button>
  </footer>
</div>

<script>
/* ══ 1. 五幕清單（幕名與檔案名逐字對應 切片\第N幕.html）════════════════ */
var ACTS = [
  { n:1, file:"第一幕.html", nm:"怡紅院群芳夜宴", tag:"花籤 · 認籤／落譜／分冊 · 三鏈" },
  { n:2, file:"第二幕.html", nm:"元妃省親",       tag:"大觀園 · 座次即身份 · 兩鏈" },
  { n:3, file:"第三幕.html", nm:"抄檢大觀園",     tag:"一夜 · 次第／定案 · 兩鏈" },
  { n:4, file:"第四幕.html", nm:"劉姥姥進大觀園", tag:"牙牌令 · 認笑態／辨箸 · 兩鏈" },
  { n:5, file:"第五幕.html", nm:"秦可卿之死",     tag:"喪儀 · 位次／逾制三處 · 兩鏈" }
];

/* ══ 2. 讀同一桶存檔（honglou.rustylake.v1；五幕逐字同鍵）══════════════ */
var SAVE_KEY = "honglou.rustylake.v1";
function readSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || typeof o !== "object") return null;
    return o;
  }catch(e){ return null; }
}
function doneSet(o){
  var s = {};
  if(!o || !o.done || !o.done.length) return s;
  for(var i=0;i<o.done.length;i++){
    var m = /^act(\d+)$/.exec(String(o.done[i]));
    if(m) s[+m[1]] = 1;
  }
  return s;
}

/* ══ 3. 生成五幕 ═══════════════════════════════════════════════════════ */
var NUM = ["","一","二","三","四","五"];
var o = readSave(), done = doneSet(o);
var cur = (o && typeof o.act === "number") ? o.act : 0;

function statusOf(n){
  if(done[n]) return { cls:"done", txt:"已完成" };
  if(cur === n) return { cls:"run", txt:"進行中" };
  if(cur > n) return { cls:"", txt:"未完成" };
  return { cls:"", txt:"未開始" };
}

var grid = document.getElementById("grid");
ACTS.forEach(function(a){
  var st = statusOf(a.n);
  var el = document.createElement("a");
  el.className = "row";
  el.href = a.file;
  el.setAttribute("data-act", a.n);
  el.innerHTML =
    '<span class="no">' + NUM[a.n] + '</span>' +
    '<span class="nm"><b>' + a.nm + '</b><i>' + a.tag + '</i></span>' +
    '<span class="st ' + st.cls + '">' + st.txt + '</span>' +
    '<span class="go">入幕 →</span>';
  grid.appendChild(el);
});

/* ══ 4.「續上一次」：已完成的最高一幕之後 ═══════════════════════════════ */
function nextAct(){
  var last = 0;
  for(var k in done) last = Math.max(last, +k);
  if(!last) return cur > 0 ? cur : 1;
  return Math.min(5, last + 1);
}
var btn = document.getElementById("next");
var hint = document.getElementById("hint");
var nxt = nextAct();
if(done[5]){
  btn.textContent = "重看第五幕";
  btn.removeAttribute("disabled");
  hint.textContent = "五幕都已收束 —— 可以任意重看某一幕。";
}else if(done[nxt] || (cur === 0 && !Object.keys(done).length)){
  btn.textContent = "從第一幕開始";
  hint.textContent = "選一幕入內；也可以按 1–5 鍵。";
}else{
  btn.textContent = "續第" + NUM[nxt] + "幕";
  hint.textContent = "已收束 " + Object.keys(done).length + " 幕 —— 接著第" + NUM[nxt] + "幕。";
}
btn.addEventListener("click", function(){
  location.href = ACTS[nxt - 1].file;
});

/* ══ 5. 鍵盤 1–5 ═════════════════════════════════════════════════════ */
document.addEventListener("keydown", function(e){
  if(e.key >= "1" && e.key <= "5"){
    location.href = ACTS[+e.key - 1].file;
  }
});
</script>
</body>
</html>
